<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Power of Silence</title>
<style>
  @font-face { font-family: 'Poppins'; font-weight: 600; src: url(fonts/Poppins-600.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 700; src: url(fonts/Poppins-700.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 800; src: url(fonts/Poppins-800.woff2) format('woff2'); }
  @font-face { font-family: 'JBM'; font-weight: 500; src: url(fonts/JetBrainsMono-500.woff2) format('woff2'); }
  @font-face { font-family: 'JBM'; font-weight: 700; src: url(fonts/JetBrainsMono-700.woff2) format('woff2'); }
  html, body { margin:0; height:100%; background:#04070D; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { height:100vh; width:56.25vh; max-width:100vw; max-height:177.78vw; display:block; cursor:pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920" title="Click to replay"></canvas>
<script>
/* =====================================================================
   THE POWER OF SILENCE — neon line-art reel, 1080x1920, 30fps, 45s
   Theme: navy-black grid, blue spotlight cone, glowing white line
   figures, orange-haired hero, orange floor glow, HUD title blocks.
   Deterministic: renderAt(t) draws the frame at time t (seconds).
   ===================================================================== */
const W = 1080, H = 1920, DURATION = 45;
const BG = '#060A12', INK = '#070C16', WHITE = '#F4F6FA', ORANGE = '#FFA51F', BLUE = '#1F6FD8',
      DIM = '#7E93B3', CROWDLINE = '#B9C7DC', MUTE = '#9AA6B8';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* ---------- math ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eo = k => 1 - Math.pow(1 - k, 3);
const ei = k => k * k * k;
const es = k => -(Math.cos(Math.PI * k) - 1) / 2;
const lin = k => k;
function K(t, kf) {
  if (t <= kf[0][0]) return kf[0][1];
  for (let i = 1; i < kf.length; i++) {
    const [t1, v1, e] = kf[i];
    if (t <= t1) { const [t0, v0] = kf[i - 1]; return lerp(v0, v1, (e || eio)((t - t0) / (t1 - t0))); }
  }
  return kf[kf.length - 1][1];
}
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const mix = (h1, h2, k) => { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = Math.round(lerp(a >> 16, b >> 16, k)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, k)), bl = Math.round(lerp(a & 255, b & 255, k));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function blink(t, seed) {
  const period = 2.6 + hash(seed) * 1.8, ph = (t + hash(seed + 3) * period) % period;
  return ph < 0.14 ? Math.sin(ph / 0.14 * Math.PI) : 0;
}
const talk = (t, seed, on = 1) => on * (0.35 + 0.65 * Math.abs(Math.sin(t * 11 + seed) * Math.sin(t * 6.3 + seed * 2)));

/* ---------- neon drawing primitives ---------- */
const LW = 3.0;   // outline width (local units)
function glowOn(c, col, b) { c.shadowColor = col; c.shadowBlur = b; }
function glowOff(c) { c.shadowBlur = 0; c.shadowColor = 'transparent'; }
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); }
// outlined tube (limb): glowing outer stroke, ink core
function tube(c, pts, w, col, gl) {
  c.lineCap = 'round'; c.lineJoin = 'round';
  glowOn(c, col, gl); c.strokeStyle = col; c.lineWidth = w; poly(c, pts); c.stroke(); glowOff(c);
  c.strokeStyle = INK; c.lineWidth = w - 2 * LW; poly(c, pts); c.stroke();
}
// outlined closed shape
function shape(c, p, col, gl, lw = LW) {
  c.fillStyle = INK; c.fill(p);
  glowOn(c, col, gl); c.strokeStyle = col; c.lineWidth = lw; c.stroke(p); glowOff(c);
}
// dim line-art for props (in world units)
function line(c, fn, col = DIM, a = 0.55, lw = 2.2, gl = 6) {
  c.save(); c.globalAlpha *= a; c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round';
  glowOn(c, col, gl); c.beginPath(); fn(c); c.stroke(); c.restore();
}
function boxOutline(c, x, y, w, h, r = 6, col = DIM, a = 0.55, lw = 2.2, ink = true) {
  if (ink) { c.fillStyle = INK; c.beginPath(); c.roundRect(x, y, w, h, r); c.fill(); }
  line(c, cc => cc.roundRect(x, y, w, h, r), col, a, lw);
}

/* =====================================================================
   CHARACTER RIG (neon line figure)
   Local units: feet at (0,0), total height ~600.
   Angles from straight down; + rotates toward screen +x.
   ===================================================================== */
const STY = {
  hero: { hero: true, hairStyle: 'spiky', jacket: true },
  b:  { hairStyle: 'curly' },  f1: { hairStyle: 'side' }, f2: { hairStyle: 'long' }, f3: { hairStyle: 'buzz' },
  c:  { hairStyle: 'cap' },    d:  { hairStyle: 'long' }, e:  { hairStyle: 'side' },  fz: { hairStyle: 'long' },
  g:  { hairStyle: 'side', glasses: true },
};
const CROWD = ['side', 'long', 'buzz', 'cap', 'curly', 'long', 'side', 'curly'].map(h => ({ hairStyle: h }));

const UA = 112, FA = 104, TH = 148, SH = 146;
const dirv = a => [Math.sin(a), Math.cos(a)];

function heroHair(look, back) {
  const p = new Path2D(), o = look * 7, N = 13;
  for (let i = 0; i <= N; i++) {
    const a = -Math.PI + 0.12 + (Math.PI - 0.24) * i / N;
    const r = i % 2 ? 38 : 54 + hash(i * 3.1) * 12;
    const x = Math.cos(a) * r * 1.02 + o * 0.4 + (i % 2 ? 0 : (i - N / 2) * 0.8), y = Math.sin(a) * r - 6;
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  if (back) { p.lineTo(36, 18); p.quadraticCurveTo(0, 30, -36, 18); }
  else { p.lineTo(34, -2); p.lineTo(24 + o, -6); p.lineTo(16 + o, -16); p.lineTo(6 + o, -4); p.lineTo(-6 + o, -16); p.lineTo(-16 + o, -4); p.lineTo(-26, -10); p.lineTo(-35, -2); }
  p.closePath();
  return p;
}
function otherHair(style, look, back) {
  const p = new Path2D(), o = look * 6;
  if (style === 'buzz') { p.moveTo(-34, -8); p.bezierCurveTo(-36, -48, 36, -48, 34, -8); p.quadraticCurveTo(0, -30, -34, -8); }
  else if (style === 'curly') { for (let i = 0; i < 9; i++) { const a = Math.PI + i * Math.PI / 8, x = Math.cos(a) * 34, y = Math.sin(a) * 38 - 8; p.moveTo(x + 12, y); p.arc(x, y, 12, 0, TAU); } }
  else if (style === 'side') { p.moveTo(-35, 0); p.bezierCurveTo(-40, -42, 30, -56, 37, -6); p.quadraticCurveTo(10 + o, -32, -14 + o, -22); p.quadraticCurveTo(-28, -18, -35, 0); }
  else if (style === 'long') {
    if (back) { p.roundRect(-40, -46, 80, 112, 30); }
    else { p.moveTo(-40, 58); p.bezierCurveTo(-48, -42, -20, -56, 0, -52); p.bezierCurveTo(22, -56, 48, -42, 40, 58); p.lineTo(28, 56); p.bezierCurveTo(34, 10, 30, -20, 6 + o, -26); p.bezierCurveTo(-18 + o, -22, -32, 10, -28, 56); p.closePath(); }
  } else if (style === 'cap') { p.moveTo(-37, -8); p.bezierCurveTo(-40, -56, 40, -56, 37, -8); p.closePath(); if (!back) p.ellipse(look * 26 + 8, -10, 30, 6, look * 0.2, 0, TAU); }
  return p;
}

function person(c, P) {
  const st = P.style, s = P.s || 1, hero = !!st.hero;
  const f = clamp(P.side || 0, -1, 1), back = !!P.back;
  const col = P.line || (hero ? WHITE : CROWDLINE);
  const gl = P.glow ?? (hero ? 18 : 9);
  const w = 1 - 0.3 * Math.abs(f);
  const wk = P.walk || { ph: 0, amp: 0 };
  const slump = P.slump || 0;
  const bob = (1 - Math.abs(Math.cos(wk.ph))) * 9 * wk.amp;
  const hipY = -292 - bob;
  c.save();
  c.translate(P.x, P.y); c.scale(s, s);
  if (P.alpha !== undefined) c.globalAlpha *= P.alpha;

  // floor glow
  if (!P.noShadow) {
    const gcol = hero ? ORANGE : BLUE, R = hero ? 260 : 140;
    const g = c.createRadialGradient(0, 0, 0, 0, 0, R);
    g.addColorStop(0, rgba(gcol, hero ? 0.55 * (P.floorGlow ?? 1) : 0.16)); g.addColorStop(1, rgba(gcol, 0));
    c.save(); c.translate(0, 4); c.scale(1, 0.11); c.fillStyle = g; c.beginPath(); c.arc(0, 0, R, 0, TAU); c.fill(); c.restore();
    if (hero) { c.save(); c.globalAlpha *= 0.9 * (P.floorGlow ?? 1); glowOn(c, ORANGE, 20); c.strokeStyle = ORANGE; c.lineWidth = 2.5;
      c.beginPath(); c.ellipse(0, 4, 120, 7, 0, 0, TAU); c.stroke(); c.restore(); }
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.beginPath(); c.ellipse(0, 3, 50, 6, 0, 0, TAU); c.fill();
  }

  // legs
  const dsign = Math.abs(f) > 0.2 ? Math.sign(f) : 0;
  const legFrom = ph => {
    if (dsign !== 0) return [dsign * Math.sin(ph) * 0.42 * wk.amp, -dsign * Math.max(0, Math.cos(ph)) * 0.75 * wk.amp];
    return [0, 0];
  };
  const legL = P.legL || legFrom(wk.ph), legR = P.legR || legFrom(wk.ph + Math.PI);
  const hipL = [-17 * w, hipY], hipR = [17 * w, hipY];
  const legPts = (hp, [a, b], ph) => {
    let lift = 0;
    if (dsign === 0 && !P.legL) lift = Math.max(0, Math.sin(ph)) * 34 * wk.amp;
    const [ux, uy] = dirv(a), [lx, ly] = dirv(a + b);
    const kn = [hp[0] + ux * TH, hp[1] + uy * (TH - lift * 0.4)];
    const ft = [kn[0] + lx * SH, kn[1] + ly * (SH - lift * 0.6)];
    return { kn, ft };
  };
  const LgL = legPts(hipL, legL, wk.ph), LgR = legPts(hipR, legR, wk.ph + Math.PI);
  const drawLeg = (hp, L) => {
    tube(c, [hp, L.kn, [L.ft[0], L.ft[1] - 6]], 30, col, gl);
    const toe = dsign;
    c.save(); glowOn(c, col, gl); c.fillStyle = col;
    c.beginPath(); c.roundRect(L.ft[0] - 15 + toe * 9, L.ft[1] - 7, 30 + Math.abs(toe) * 6, 8, 3); c.fill(); c.restore();
  };
  if (!P.hideLegs) { if (dsign > 0) { drawLeg(hipL, LgL); drawLeg(hipR, LgR); } else { drawLeg(hipR, LgR); drawLeg(hipL, LgL); } }

  // upper body
  c.translate(0, hipY);
  c.rotate(P.lean || 0);
  const br = 1 + (P.breath || 0) * 0.045;
  const shY = -196 + slump * 16;
  const shL = [-46 * w + f * 4, shY + 10], shR = [46 * w + f * 4, shY + 10];
  const armPts = (sh, arm) => {
    const [a, b] = arm; const [ux, uy] = dirv(a), [fx, fy] = dirv(a + b);
    const el = [sh[0] + ux * UA, sh[1] + uy * UA];
    const hd = [el[0] + fx * FA, el[1] + fy * FA];
    return { el, hd, ang: a + b, fdir: [fx, fy] };
  };
  const swing = Math.sin(wk.ph) * 0.4 * wk.amp;
  const armL = P.armL || [-0.08 - swing * (dsign || 1), 0.12 + 0.2 * wk.amp, 'open'];
  const armR = P.armR || [0.08 + swing * (dsign || 1), -0.12 - 0.2 * wk.amp, 'open'];
  const AL = armPts(shL, armL), AR = armPts(shR, armR);
  const drawArm = (sh, A, arm) => {
    tube(c, [sh, A.el, [A.hd[0] - A.fdir[0] * 8, A.hd[1] - A.fdir[1] * 8]], 19, col, gl);
    const type = arm[2] || 'open';
    c.save(); glowOn(c, col, gl); c.fillStyle = col;
    if (type === 'fist') { c.beginPath(); c.arc(A.hd[0], A.hd[1], 11, 0, TAU); c.fill(); glowOff(c); c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); c.arc(A.hd[0], A.hd[1], 6, 0.3, 2.6); c.stroke(); }
    else if (type === 'point') { c.beginPath(); c.arc(A.hd[0], A.hd[1], 8, 0, TAU); c.fill(); c.strokeStyle = col; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(A.hd[0], A.hd[1]); c.lineTo(A.hd[0] + A.fdir[0] * 24, A.hd[1] + A.fdir[1] * 24); c.stroke(); }
    else { c.beginPath(); c.arc(A.hd[0], A.hd[1], 7.5 * (arm[3] ?? 1) + 0.5, 0, TAU); c.fill(); }
    c.restore();
  };
  const farArm = f > 0.25 ? 'R' : f < -0.25 ? 'L' : null;
  if (back) { drawArm(shL, AL, armL); drawArm(shR, AR, armR); }
  else { if (farArm === 'R') drawArm(shR, AR, armR); if (farArm === 'L') drawArm(shL, AL, armL); }

  // torso
  const torso = new Path2D(), tw = w * br;
  torso.moveTo(-34 * w, 12);
  torso.bezierCurveTo(-38 * w, -60, -52 * tw, -140, -52 * tw, shY + 22);
  torso.quadraticCurveTo(-50 * tw, shY - 4, -24 * w, shY - 8);
  torso.lineTo(24 * w, shY - 8);
  torso.quadraticCurveTo(50 * tw, shY - 4, 52 * tw, shY + 22);
  torso.bezierCurveTo(52 * tw, -140, 38 * w, -60, 34 * w, 12);
  torso.closePath();
  shape(c, torso, col, gl);
  if (!back) {
    c.save(); c.globalAlpha *= 0.6; c.strokeStyle = col; c.lineWidth = 2.2; c.lineCap = 'round';
    const cx = f * 16;
    if (st.jacket) {
      c.beginPath(); c.moveTo(cx - 16, shY - 6); c.lineTo(cx - 6, 8); c.moveTo(cx + 16, shY - 6); c.lineTo(cx + 6, 8); c.stroke();
      c.globalAlpha /= 0.6; glowOn(c, ORANGE, 8); c.strokeStyle = rgba(ORANGE, 0.85); c.lineWidth = 2;
      c.beginPath(); c.moveTo(cx, shY + 30); c.lineTo(cx, 6); c.stroke();
    } else { c.beginPath(); c.arc(cx, shY - 10, 18, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke(); }
    c.restore();
    c.save(); c.globalAlpha *= 0.6; c.strokeStyle = col; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-30 * w, 0); c.lineTo(30 * w, 0); c.moveTo(f * 8, 0); c.lineTo(f * 8, 24); c.stroke(); c.restore();
  }

  // neck ring + head
  const look = clamp(f * 0.75 + (P.look || 0), -1, 1);
  const hx = f * 12 + (P.look || 0) * 4, hy = shY - 64 + slump * 10;
  c.save(); glowOn(c, col, gl); c.strokeStyle = col; c.lineWidth = LW;
  c.fillStyle = INK; c.beginPath(); c.ellipse(hx * 0.5, shY - 14, 17, 8, 0, 0, TAU); c.fill(); c.stroke(); c.restore();
  c.save();
  c.translate(hx, hy); c.rotate((P.tilt || 0) + slump * 0.12 * (dsign || 1)); c.translate(0, slump * 6);
  if (st.hairStyle === 'long' && !back) shape(c, otherHair('long', look, false), col, gl);
  const headP = new Path2D(); headP.ellipse(0, 0, 33, 39, 0, 0, TAU);
  shape(c, headP, col, gl);
  if (!back) drawFace(c, P, look, col, gl);
  if (st.hairStyle === 'spiky') {
    c.save(); glowOn(c, ORANGE, 28); c.fillStyle = ORANGE; c.fill(heroHair(look, back));
    glowOff(c); c.globalAlpha *= 0.35; c.fillStyle = '#FFE2A8'; c.beginPath(); c.ellipse(10 + look * 6, -38, 14, 5, -0.3, 0, TAU); c.fill(); c.restore();
  } else if (st.hairStyle !== 'long' || back) {
    shape(c, otherHair(st.hairStyle, look, back), col, gl);
  }
  c.restore();

  if (!back) { if (farArm !== 'L') drawArm(shL, AL, armL); if (farArm !== 'R') drawArm(shR, AR, armR); }
  if (P.prop) P.prop(c, { AL, AR, shY, col, gl });
  c.restore();
  return { hipY, AL, AR };
}

function drawFace(c, P, look, col, gl) {
  const fx = look * 16, sq = 1 - 0.38 * Math.abs(look);
  const ang = P.ang || 0, wor = P.worry || 0, sm = P.smile || 0;
  const bl = clamp((P.blink || 0) + ang * 0.25 + (P.squint || 0));
  c.save(); glowOn(c, col, gl * 0.6); c.fillStyle = col; c.strokeStyle = col; c.lineCap = 'round';
  for (const ex0 of [-12, 12]) {
    const far = (ex0 < 0 && look > 0.45) || (ex0 > 0 && look < -0.45);
    const ex = fx + ex0 * sq + (P.eyeX || 0) * 2.5, ey = 2 + (P.eyeY || 0) * 2;
    const eh = Math.max(1.1, 5 * (1 - bl)) * (far ? 0.85 : 1);
    c.beginPath(); c.ellipse(ex, ey, 3.6 * sq * (far ? 0.8 : 1), eh, 0, 0, TAU); c.fill();
    const bx = fx + ex0 * sq, inner = ex0 < 0 ? 1 : -1;
    const ix = bx + inner * 6, ox = bx - inner * 7;
    const iy = -11 + ang * 6 - wor * 5, oy = -13 - ang * 1.5 + wor * 2.5;
    c.lineWidth = 3; c.beginPath(); c.moveTo(ox, oy); c.quadraticCurveTo((ix + ox) / 2, Math.min(iy, oy) - 2, ix, iy); c.stroke();
  }
  const mo = P.mouth || 0, mx = fx * 1.05, my = 22, mw = 10 * sq * (1 + 0.15 * sm);
  c.lineWidth = 2.6;
  if (mo > 0.08) { c.fillStyle = INK; c.beginPath(); c.ellipse(mx, my + mo * 2, mw * (0.75 + 0.25 * mo), 1.5 + mo * 7.5, 0, 0, TAU); c.fill(); c.stroke(); }
  else { c.beginPath(); c.moveTo(mx - mw, my - sm * 3); c.quadraticCurveTo(mx, my + sm * 5, mx + mw, my - sm * 3); c.stroke(); }
  if (P.style.glasses) { c.lineWidth = 2; for (const ex0 of [-12, 12]) { c.beginPath(); c.roundRect(fx + ex0 * sq - 9, -5, 18, 13, 4); c.stroke(); } }
  c.restore();
}

/* ---------- camera ---------- */
function setCam(c, cam) { c.setTransform(cam.z, 0, 0, cam.z, W / 2 - cam.x * cam.z, H / 2 - cam.y * cam.z); }
const screen = c => c.setTransform(1, 0, 0, 1, 0, 0);
const toScreen = (cam, x, y) => [W / 2 + (x - cam.x) * cam.z, H / 2 + (y - cam.y) * cam.z];

/* ---------- stage: grid, spotlight, corner glows ---------- */
function glow(c, x, y, r, col, a) {
  if (r <= 0 || a <= 0) return;
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
}
function stage(c, cam, opts = {}) {
  screen(c);
  c.fillStyle = BG; c.fillRect(0, 0, W, H);
  glow(c, -40, -40, 520, ORANGE, 0.16 * (opts.corner ?? 1));
  glow(c, W + 60, H + 60, 620, ORANGE, 0.2 * (opts.corner ?? 1));
  const gs = 58, ox = ((-cam.x * 0.35 * cam.z) % gs + gs) % gs, oy = ((-cam.y * 0.35 * cam.z) % gs + gs) % gs;
  c.strokeStyle = 'rgba(90,130,190,0.07)'; c.lineWidth = 1; c.beginPath();
  for (let x = ox; x < W; x += gs) { c.moveTo(x, 0); c.lineTo(x, H); }
  for (let y = oy; y < H; y += gs) { c.moveTo(0, y); c.lineTo(W, y); }
  c.stroke();
  for (const sp of (opts.spots || [])) {
    const [sx, sy] = toScreen(cam, sp.x, sp.floor);
    const a = sp.a ?? 1, topY = -80, wTop = 180 * (sp.w ?? 1), wBot = 620 * (sp.w ?? 1) * Math.min(2.2, cam.z);
    const by = Math.min(sy + 60, H + 200);
    c.save();
    const g = c.createLinearGradient(0, topY, 0, by);
    g.addColorStop(0, rgba(BLUE, 0.42 * a)); g.addColorStop(0.55, rgba(BLUE, 0.16 * a)); g.addColorStop(1, rgba(BLUE, 0.02 * a));
    c.fillStyle = g; c.filter = 'blur(28px)';
    c.beginPath(); c.moveTo(sx - wTop / 2, topY); c.lineTo(sx + wTop / 2, topY); c.lineTo(sx + wBot / 2, by); c.lineTo(sx - wBot / 2, by); c.closePath(); c.fill();
    c.filter = 'none'; c.restore();
    glow(c, sx, 120, 360, BLUE, 0.3 * a);
  }
  const [, fy] = toScreen(cam, 0, opts.floor ?? G);
  if (opts.floor !== -1 && fy > 0 && fy < H) {
    const g = c.createLinearGradient(0, 0, W, 0);

  glyph(c, 'HA', 120, G - 700 + Math.sin(lt * 18) * 5, 34, ORANGE, laughC * (lt > 1.2 && lt < 3.9 ? 0.9 : 0));
  glyph(c, 'HA HA', 330, G - 720 + Math.sin(lt * 16) * 5, 30, ORANGE, laughC * (lt > 1.4 && lt < 2.7 ? 0.9 : 0));
  person(c, {
    x: hx, y: G, s: 1.0, side, style: STY.hero, floorGlow: lerp(0.4, 1, seg(lt, 4.8, 6.0)), glow: 16 + 10 * seg(lt, 4.8, 5.6),
    lean: pushed * 0.12,
    walk: walking ? { ph: (hx - 720) / 150 * Math.PI, amp: K(lt, [[6.6, 0], [7.0, 1]]) } : { ph: 0, amp: 0 },
    armL: walking ? undefined : [-0.1 - pushed * 0.2, 0.15, 'open'], armR: walking ? undefined : [0.1, -0.15, 'open'],
    ang: K(lt, [[3.4, 0], [3.9, 0.55], [4.6, 0.55], [5.4, 0]]), smile: K(lt, [[5.0, 0], [5.6, 0.12]]),
    squint: K(lt, [[4.4, 0], [4.9, 0.25], [5.5, 0.08]]),
    eyeX: side < 0 ? K(lt, [[4.0, -0.8], [4.6, -0.8], [5.0, 0]]) : 0.3, blink: lt > 5.0 && lt < 5.25 ? Math.sin(seg(lt, 5.0, 5.25) * Math.PI) : 0,
    breath: K(lt, [[4.6, 0], [5.1, 1, es], [5.7, 0.1, es]]), look: K(lt, [[4.0, 0], [4.6, -0.2], [5.4, 0.0]]),
  });
  vignette(c, 0.6 + 0.25 * eyesK);
  const tr = seg(lt, 7.3, 8.0);
  if (tr > 0) { screen(c); const g = c.createLinearGradient(W, 0, 0, 0); g.addColorStop(0, rgba(ORANGE, 0.3 * tr)); g.addColorStop(1, rgba(ORANGE, 0)); c.fillStyle = g; c.fillRect(0, 0, W, H); c.fillStyle = `rgba(6,10,18,${eio(tr) * 0.9})`; c.fillRect(0, 0, W, H); }
}

/* ---------- SCENE 5 — WHEN YOU DON'T KNOW ENOUGH (29–37s) ---------- */
function scene5(c, lt) {
  const shot = lt < 2.6 ? 'wide' : lt < 4.3 ? 'ots' : lt < 5.3 ? 'eyes' : lt < 6.0 ? 'wide2' : lt < 7.1 ? 'nb' : 'face';
  const hx = K(lt, [[0, -60], [1.4, 170, eo]]);
  const heroY = G + 40, heroS = 1.08;
  let cam;
  if (shot === 'wide') cam = { x: K(lt, [[0, 420], [1.6, 540]]), y: G - 360, z: 1.2 };
  else if (shot === 'ots') cam = { x: 640, y: G - 420, z: K(lt, [[2.6, 1.35], [4.3, 1.45, lin]]) };
  else if (shot === 'eyes') cam = { x: hx + 12, y: heroY - (292 + 196 + 64) * heroS + 2, z: K(lt, [[4.3, 5.2], [5.3, 5.6, lin]]) };
  else if (shot === 'wide2') cam = { x: 600, y: G - 400, z: 1.35 };
  else if (shot === 'nb') cam = { x: 290, y: G - 330, z: K(lt, [[6.0, 3.0], [7.1, 3.2, lin]]) };
  else cam = { x: hx + 40, y: heroY - 520, z: K(lt, [[7.1, 2.4], [8, 2.2, lin]]) };
  const gTalk = lt > 4.6 && lt < 6.4;
  stage(c, cam, { spots: [{ x: 640, floor: G, a: 0.6 }, { x: hx, floor: G, a: 0.4 + 0.5 * seg(lt, 6.4, 7.4), w: 0.8 }] });
  setCam(c, cam);
  c.fillStyle = '#09111E'; c.fillRect(560, 560, 470, 330);
  line(c, cc => cc.rect(560, 560, 470, 330), WHITE, 0.7, 3, 10);
  const a1 = seg(lt, 0.4, 1.4), a2 = seg(lt, 1.0, 2.0), kd = seg(lt, 4.7, 6.1);
  if (a1 > 0) line(c, cc => cc.arc(680, 720, 56, 0, TAU * a1), WHITE, 0.85, 4, 8);
  if (a2 > 0) line(c, cc => cc.arc(910, 720, 56, 0, TAU * a2), WHITE, 0.85, 4, 8);
  if (kd > 0) {
    line(c, cc => { cc.moveTo(736, 720); cc.lineTo(736 + 60 * seg(kd, 0, 0.4), 720); cc.moveTo(854, 720); cc.lineTo(854 - 60 * seg(kd, 0, 0.4), 720); cc.moveTo(640, 820); cc.lineTo(640 + 310 * seg(kd, 0.5, 1), 820); }, ORANGE, 1, 5, 14);
    const r = seg(kd, 0.35, 1); c.save(); glowOn(c, ORANGE, 30); c.fillStyle = ORANGE; c.beginPath(); c.arc(795, 720, 26 * r, 0, TAU); c.fill(); c.restore();
  }
  lamp(c, 300, 640, 440, 0.8); lamp(c, 760, 520, 320, 0.8);
  const tbY = G - 260;
  const eTalk = Math.sin(lt * 2.2) > 0 && lt < 4.7, fTalk = !eTalk && lt < 4.7;
  person(c, { x: 900, y: G - 40, s: 0.9, side: -0.35, style: STY.g,
    armR: gTalk ? [K(lt, [[4.6, 0.1], [5.0, -0.2]]), K(lt, [[4.6, 0], [5.0, -1.5]]) + Math.sin(lt * 5) * 0.2, 'open'] : [0.1, -0.1, 'open'],
    armL: gTalk ? [-0.6 + Math.sin(lt * 4) * 0.15, 1.5, 'open'] : [-0.1, 0.1, 'open'],
    mouth: gTalk ? talk(lt, 12) * 0.6 : 0, smile: 0.2, blink: blink(lt, 101), look: -0.2, eyeX: lt < 4.6 ? -0.6 : -0.9 });
  person(c, { x: 470, y: G, s: 1.0, side: 0.6, style: STY.e, hideLegs: true,
    armR: eTalk ? [0.9 + Math.sin(lt * 9) * 0.25, -1.2, 'open'] : [0.25, -0.5, 'open'], armL: [-0.15, 0.4, 'open'],
    ang: eTalk ? 0.6 : 0.3, mouth: eTalk ? talk(lt, 13) * 0.8 : 0, blink: blink(lt, 111), lean: eTalk ? 0.06 : 0, look: gTalk ? 0.3 : 0, eyeX: 1 });
  person(c, { x: 760, y: G, s: 1.0, side: -0.6, style: STY.fz, hideLegs: true,
    armL: fTalk ? [-0.9 - Math.sin(lt * 9) * 0.25, 1.2, 'open'] : [-0.25, 0.5, 'open'], armR: [0.15, -0.4, 'open'],
    ang: fTalk ? 0.6 : 0.3, mouth: fTalk ? talk(lt, 14) * 0.8 : 0, blink: blink(lt, 121), lean: fTalk ? -0.06 : 0, eyeX: gTalk ? 1 : -1, look: gTalk ? 0.4 : 0 });
  table(c, 330, tbY, 600, 300);
  if (lt < 4.6) { const p = (lt * 2.2) % 1; glyph(c, eTalk ? '//' : '\\\\', eTalk ? 560 : 690, G - 600 - p * 20, 30, ORANGE, 0.7 * (1 - p)); }
  const understand = seg(lt, 6.6, 7.4), uncertain = seg(lt, 0.9, 1.6) * (1 - seg(lt, 5.6, 6.6));
  const eyeDart = lt < 4.6 ? (Math.sin(lt * 2.2) > 0 ? -0.2 : 1) : 1;
  const writing = lt > 6.0 && lt < 7.1;
  person(c, {
    x: shot === 'ots' ? 400 : hx, y: shot === 'ots' ? G + 320 : heroY, s: shot === 'ots' ? 1.75 : heroS,
    side: shot === 'ots' ? 0.35 : 0.55, back: shot === 'ots', style: STY.hero, noShadow: shot === 'ots',
    walk: lt < 1.4 ? { ph: (hx + 60) / 140 * Math.PI, amp: 1 - seg(lt, 1.0, 1.4) } : { ph: 0, amp: 0 },
    worry: uncertain * 0.7, smile: lerp(-0.05, 0.4, understand),
    eyeX: shot === 'eyes' ? K(lt, [[4.3, 0.2], [4.55, 1], [4.85, 1], [5.05, 0.4], [5.3, 1]]) : (writing ? 0 : eyeDart),
    eyeY: writing ? 1 : 0, tilt: uncertain * -0.06 + understand * 0.05 * Math.sin(lt * 6), blink: blink(lt, 131), look: 0.1,
    armR: lt < 1.4 ? undefined : (writing || shot === 'face' ? [0.95 + (writing ? Math.sin(lt * 30) * 0.05 : 0), -0.85, 'open'] : [0.12, -0.15, 'open']),
    armL: lt < 1.4 ? undefined : [0.6, -1.1, 'open'],
    prop: (cc, j) => { if (lt > 1.4 && shot !== 'ots') { const hd = j.AL.hd; cc.save(); cc.fillStyle = INK; cc.beginPath(); cc.roundRect(hd[0] - 10, hd[1] - 44, 92, 64, 5); cc.fill(); glowOn(cc, ORANGE, 10); cc.strokeStyle = ORANGE; cc.lineWidth = 2.4; cc.stroke(); cc.restore(); } },
  });
  if (shot === 'nb') {
    const nbX = 290, nbY = G - 360;
    c.save(); c.translate(nbX, nbY);
    notebook(c, 0, 0, 300, 200, 0, null);
    const wk = seg(lt, 6.15, 6.95), wk2 = seg(lt, 6.55, 7.0);
    c.font = '700 22px JBM'; c.textBaseline = 'middle';
    c.save(); c.beginPath(); c.rect(-140, -70, 280 * wk, 40); c.clip(); c.fillStyle = WHITE; glowOn(c, WHITE, 6); c.fillText('LISTEN FIRST.', -130, -48); c.restore();
    c.save(); c.beginPath(); c.rect(-140, -26, 280 * wk2, 40); c.clip(); c.fillStyle = ORANGE; glowOn(c, ORANGE, 10); c.fillText('THEN SPEAK.', -130, -6); c.restore();
    line(c, cc => { cc.moveTo(-130, 16); cc.lineTo(-130 + 150 * seg(lt, 6.85, 7.05), 16); }, ORANGE, 1, 3, 12);
    const px = -130 + 170 * (lt < 6.55 ? wk : wk2), py = lt < 6.55 ? -48 : -6;
    c.save(); glowOn(c, WHITE, 10); c.fillStyle = WHITE; c.beginPath(); c.arc(px + 14, py + 14, 8, 0, TAU); c.fill();
    c.strokeStyle = ORANGE; glowOn(c, ORANGE, 10); c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(px, py + 4); c.lineTo(px + 26, py - 26); c.stroke(); c.restore();
    c.restore();
  }
  if (shot === 'wide') glyph(c, '?', hx + 60, heroY - 690, 54, WHITE, uncertain * 0.7);
  vignette(c, 0.6);
  const inK = seg(lt, 0, 0.5);
  if (inK < 1) { screen(c); c.fillStyle = `rgba(6,10,18,${0.9 * (1 - eio(inK))})`; c.fillRect(0, 0, W, H); }
  for (const tc of [2.6, 4.3, 5.3, 6.0, 7.1]) { const d = lt - tc; if (d >= 0 && d < 0.12) { screen(c); c.fillStyle = `rgba(4,7,13,${0.5 * (1 - d / 0.12)})`; c.fillRect(0, 0, W, H); } }
  const out = seg(lt, 7.5, 8.0);
  if (out > 0) { screen(c); c.fillStyle = `rgba(4,7,13,${eio(out) * 0.85})`; c.fillRect(0, 0, W, H); }
}

/* ---------- SCENE 6 — POWERFUL ENDING (37–45s) ---------- */
function scene6(c, lt) {
  const warm = seg(lt, 0.5, 4.5);
  const pull = eio(seg(lt, 2.0, 5.6));
  const hzY = 760;
  const dist = K(lt, [[0, 0], [5.6, 1, lin], [6.3, 1.04, eo]]);
  const hs = lerp(1.25, 0.62, Math.min(1, dist)) * lerp(1, 0.8, pull);
  const footY = lerp(H + 140, 1300, Math.min(1, dist));
  const cam = { x: 540, y: 960, z: 1 };
  stage(c, cam, { spots: [{ x: 540, floor: footY, a: lerp(0.4, 1.1, warm), w: lerp(1.2, 0.85, pull) }], corner: 0.6 + 0.6 * warm, floor: -1 });
  screen(c);
  const nearW = lerp(1500, 1100, pull), farW = 40;
  c.save();
  const pg = c.createLinearGradient(0, hzY, 0, H);
  pg.addColorStop(0, rgba(ORANGE, 0.0)); pg.addColorStop(0.35, rgba(ORANGE, 0.12 * warm)); pg.addColorStop(1, rgba(ORANGE, 0.04));
  c.fillStyle = pg;
  c.beginPath(); c.moveTo(540 - farW / 2, hzY); c.lineTo(540 + farW / 2, hzY); c.lineTo(540 + nearW / 2, H); c.lineTo(540 - nearW / 2, H); c.closePath(); c.fill();
  glowOn(c, ORANGE, 16); c.strokeStyle = rgba(ORANGE, 0.35 + 0.55 * warm); c.lineWidth = 3;
  c.beginPath(); c.moveTo(540 - farW / 2, hzY); c.lineTo(540 - nearW / 2, H); c.moveTo(540 + farW / 2, hzY); c.lineTo(540 + nearW / 2, H); c.stroke();
  glowOff(c);
  for (let i = 0; i < 12; i++) {
    const z = ((i / 12 + lt * 0.07) % 1), e = Math.pow(1 - z, 2.4), yy = hzY + (H - hzY) * e, ww = lerp(farW, nearW, e);
    c.strokeStyle = rgba(ORANGE, (0.08 + 0.25 * warm) * e); c.lineWidth = 2; c.beginPath(); c.moveTo(540 - ww / 2, yy); c.lineTo(540 + ww / 2, yy); c.stroke();
  }
  c.restore();
  for (let i = 0; i < 8; i++) {
    const sd = i % 2 ? 1 : -1, d = seg(lt, 0.3 + i * 0.35, 1.0 + i * 0.35), a = (1 - d) * 0.55;
    if (a <= 0) continue;
    const x = 540 + sd * (300 + hash(i) * 150), y = 1150 + hash(i + 4) * 350;
    c.save(); c.globalAlpha = a; c.filter = `blur(${1 + d * 10}px)`;
    person(c, { x, y: y + 280, s: 0.7, side: -sd * 0.6, style: CROWD[i % 8], ang: 0.5, mouth: talk(lt, i) * 0.8, noShadow: true, glow: 6,
      armR: [0.6 + 0.4 * Math.sin(lt * 5 + i), -1.4, 'open'], armL: [-0.4, 1.2, 'open'] });
    c.filter = 'none';
    if (i % 3 === 0) { glowOn(c, ORANGE, 14); c.strokeStyle = ORANGE; c.lineWidth = 2.5; c.beginPath(); c.roundRect(x - sd * 80, y - 120, 30, 52, 5); c.stroke(); }
    c.restore();
  }
  const walkAmp = 1 - seg(lt, 5.6, 6.3);
  person(c, { x: 540, y: footY, s: hs, side: 0, back: true, style: STY.hero, walk: { ph: lt * 5.6, amp: walkAmp }, glow: 18 + 12 * warm, floorGlow: 0.5 + 0.7 * warm,
    armL: walkAmp < 0.05 ? [-0.12, 0.18, 'open'] : undefined, armR: walkAmp < 0.05 ? [0.12, -0.18, 'open'] : undefined, breath: Math.sin(lt * 2) * 0.5 + 0.5 });
  dust(c, lt, 40, 7, { x: 0, y: 300, w: W, h: 1100 }, ORANGE, 0.3 * warm);
  vignette(c, 0.7);
}

/* =====================================================================
   MASTER TIMELINE
   ===================================================================== */
const SCENES = [[0, 5, scene1], [5, 13, scene2], [13, 21, scene3], [21, 29, scene4], [29, 37, scene5], [37, 45, scene6]];
function renderAt(t) {
  t = clamp(t, 0, DURATION - 1e-4);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; glowOff(ctx);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  for (const [a, b, fn] of SCENES) if (t >= a && t < b) { ctx.save(); fn(ctx, t - a); ctx.restore(); }
  ctx.save(); wipe(ctx, t); ctx.restore();
  ctx.save(); drawHUD(ctx, t); ctx.restore();
  grain(ctx, t);
}
window.renderAt = renderAt;
window.DURATION = DURATION;

const params = new URLSearchParams(location.search);
window.ready = Promise.all(['800 40px Poppins', '700 20px JBM', '500 20px JBM'].map(f => document.fonts.load(f)));
if (params.has('capture')) window.ready.then(() => renderAt(0));
else if (params.has('t')) window.ready.then(() => renderAt(parseFloat(params.get('t'))));
else {
  let start = performance.now();
  const loop = () => { renderAt(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
  window.ready.then(loop);
  canvas.addEventListener('click', () => { start = performance.now(); });
}
</script>

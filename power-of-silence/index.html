<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Power of Silence</title>
<style>
  @font-face { font-family: 'Bebas Neue'; src: url(fonts/BebasNeue.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 500; src: url(fonts/Poppins-500.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 600; src: url(fonts/Poppins-600.woff2) format('woff2'); }
  @font-face { font-family: 'Poppins'; font-weight: 700; src: url(fonts/Poppins-700.woff2) format('woff2'); }
  :root { --bg:#17191F; }
  html, body { margin:0; height:100%; background:#0C0D11; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { height:100vh; width:56.25vh; max-width:100vw; max-height:177.78vw; display:block; cursor:pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920" title="Click to replay"></canvas>
<script>
/* =====================================================================
   THE POWER OF SILENCE — cinematic 2D reel, 1080x1920, 30fps, 45s
   Deterministic: renderAt(t) draws the frame at time t (seconds).
   Palette: charcoal #17191F, ivory #F2EDE3, gold #D6A84B,
            slate #252830, near-black #0C0D11.
   ===================================================================== */
const W = 1080, H = 1920, DURATION = 45;
const BG = '#17191F', IVORY = '#F2EDE3', GOLD = '#D6A84B', SLATE = '#252830', SHADOW = '#0C0D11';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* ---------- math ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eo = k => 1 - Math.pow(1 - k, 3);
const ei = k => k * k * k;
const es = k => -(Math.cos(Math.PI * k) - 1) / 2;
const lin = k => k;
// keyframes: [[t, v, ease?], ...]  (ease applies to the segment ending at that key)
function K(t, kf) {
  if (t <= kf[0][0]) return kf[0][1];
  for (let i = 1; i < kf.length; i++) {
    const [t1, v1, e] = kf[i];
    if (t <= t1) { const [t0, v0] = kf[i - 1]; return lerp(v0, v1, (e || eio)((t - t0) / (t1 - t0))); }
  }
  return kf[kf.length - 1][1];
}
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const mix = (h1, h2, k) => { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = Math.round(lerp(a >> 16, b >> 16, k)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, k)), bl = Math.round(lerp(a & 255, b & 255, k));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
// blink: quick closes at pseudo-random intervals
function blink(t, seed) {
  const period = 2.6 + hash(seed) * 1.8, ph = (t + hash(seed + 3) * period) % period;
  return ph < 0.14 ? Math.sin(ph / 0.14 * Math.PI) : 0;
}
const talk = (t, seed, on = 1) => on * (0.35 + 0.65 * Math.abs(Math.sin(t * 11 + seed) * Math.sin(t * 6.3 + seed * 2)));

/* ---------- global light (set per scene) ---------- */
let LIGHT = { dx: 1, dy: -0.6, rim: 3.2, a: 0.9, col: GOLD };

/* =====================================================================
   CHARACTER RIG
   Local units: feet at (0,0), total height ~600.
   Angles: measured from straight down; + rotates toward screen +x.
   ===================================================================== */
const STY = {
  hero:  { skin: '#B97D58', skinD: '#93603F', hair: '#0D0D11', hairStyle: 'hero', top: '#16171C', topL: '#262831', inner: '#2C303A', pants: '#111217', shoe: '#0A0A0D', sole: '#3A3C44', jacket: true },
  b:     { skin: '#C99472', skinD: '#A2725A', hair: '#2A1E17', hairStyle: 'curly', top: '#5C3A3A', topL: '#7A5050', pants: '#2E3240', shoe: '#1C1C20', sole: '#8A847A' },
  f1:    { skin: '#A86F4D', skinD: '#87563A', hair: '#141210', hairStyle: 'side', top: '#3D4A5C', topL: '#55657A', pants: '#2A2D35', shoe: '#1A1A1D', sole: '#77736C' },
  f2:    { skin: '#D2A07C', skinD: '#AE7E5F', hair: '#3B2A1E', hairStyle: 'long', top: '#6E6450', topL: '#8C8168', pants: '#2C2C33', shoe: '#1B1B1F', sole: '#7D786E' },
  f3:    { skin: '#9C6646', skinD: '#7B4E34', hair: '#111', hairStyle: 'buzz', top: '#4A5A48', topL: '#62775F', pants: '#24262C', shoe: '#18181B', sole: '#6E6A62' },
  c:     { skin: '#B07656', skinD: '#8C5B41', hair: '#141110', hairStyle: 'cap', cap: '#6B2E2E', top: '#5A2C2C', topL: '#7C4141', pants: '#23252D', shoe: '#E8E2D6', sole: '#B9B3A7' },
  d:     { skin: '#C48A66', skinD: '#9D6B4E', hair: '#1D1612', hairStyle: 'long', top: '#4E5236', topL: '#686D49', pants: '#1F2128', shoe: '#1A1A1E', sole: '#77736A' },
  e:     { skin: '#BC8462', skinD: '#966549', hair: '#1A1513', hairStyle: 'side', top: '#3E5266', topL: '#577089', pants: '#262931', shoe: '#19191C', sole: '#757168' },
  fz:    { skin: '#D0A07E', skinD: '#A97F62', hair: '#4A3526', hairStyle: 'long', top: '#7A4E3A', topL: '#9A6650', pants: '#2A2B31', shoe: '#1B1B1E', sole: '#7A766C' },
  g:     { skin: '#A97250', skinD: '#87583D', hair: '#8D8A84', hairStyle: 'side', top: '#8A7C62', topL: '#A6977A', pants: '#2E2F35', shoe: '#1C1C1F', sole: '#7C786F', glasses: true },
};
// muted crowd variations
const CROWD = [
  { skin: '#B98060', skinD: '#956449', hair: '#1A1512', hairStyle: 'side', top: '#3B4555', topL: '#50607A', pants: '#262931', shoe: '#18181B', sole: '#6D6960' },
  { skin: '#CC9A78', skinD: '#A57A5E', hair: '#2E211A', hairStyle: 'long', top: '#5E4A4A', topL: '#7A6262', pants: '#2A2B31', shoe: '#1A1A1D', sole: '#76716A' },
  { skin: '#A16A4A', skinD: '#7F5238', hair: '#121212', hairStyle: 'buzz', top: '#4C5444', topL: '#647058', pants: '#22242A', shoe: '#17171A', sole: '#6A665E' },
  { skin: '#C08866', skinD: '#9B6A4F', hair: '#191411', hairStyle: 'cap', cap: '#3E4A5C', top: '#56483A', topL: '#726050', pants: '#25272E', shoe: '#1B1B1E', sole: '#77736A' },
  { skin: '#D4A684', skinD: '#AD8466', hair: '#4A3A2C', hairStyle: 'curly', top: '#3F3F4E', topL: '#575769', pants: '#2A2C33', shoe: '#1A1A1D', sole: '#79756C' },
  { skin: '#B27858', skinD: '#8E5E43', hair: '#151210', hairStyle: 'long', top: '#625836', topL: '#7E7348', pants: '#24262C', shoe: '#18181B', sole: '#6F6B63' },
  { skin: '#9A6445', skinD: '#7A4D34', hair: '#101010', hairStyle: 'side', top: '#5A3F4A', topL: '#755563', pants: '#23252B', shoe: '#18181B', sole: '#6C685F' },
  { skin: '#C6906C', skinD: '#A07155', hair: '#2A1F18', hairStyle: 'curly', top: '#34505A', topL: '#486A77', pants: '#272930', shoe: '#19191C', sole: '#736F66' },
];

const UA = 112, FA = 104, TH = 148, SH = 146;   // upper arm, forearm, thigh, shin
const dirv = a => [Math.sin(a), Math.cos(a)];

// draw a part with a gold rim on the light side (offset silhouette behind it)
function rimmed(c, s, drawFn, rimScale = 1) {
  if (LIGHT.a > 0 && rimScale > 0) {
    c.save();
    c.translate(LIGHT.dx * LIGHT.rim * 0.7 * rimScale / s, LIGHT.dy * LIGHT.rim * 0.7 * rimScale / s);
    c.globalAlpha *= LIGHT.a * 0.8;
    drawFn(LIGHT.col, true);
    c.restore();
  }
  drawFn(null, false);
}

function limb(c, pts, w, col) {
  c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.stroke();
}

function drawHand(c, x, y, ang, type, col, colD, open = 1) {
  c.save(); c.translate(x, y); c.rotate(-ang);
  c.fillStyle = col;
  if (type === 'fist') {
    c.beginPath(); c.roundRect(-14, -6, 28, 26, 10); c.fill();
    c.strokeStyle = colD; c.lineWidth = 2;
    for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(-9 + i * 8, 14); c.lineTo(-9 + i * 8, 19); c.stroke(); }
  } else if (type === 'point') {
    c.beginPath(); c.roundRect(-12, -6, 24, 22, 9); c.fill();
    c.beginPath(); c.roundRect(-4, 8, 9, 30, 4.5); c.fill();
  } else { // open
    c.beginPath(); c.ellipse(0, 10, 12, 16 * (0.8 + 0.2 * open), 0, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(11, 4, 4, 9, -0.6, 0, TAU); c.fill();
    c.strokeStyle = colD; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(-4, 18); c.lineTo(-4, 24); c.moveTo(3, 18); c.lineTo(3, 25); c.stroke();
  }
  c.restore();
}

function hairPath(c, style, hx, look, back) {
  const p = new Path2D();
  if (style === 'hero') {
    if (back) { p.ellipse(0, -6, 38, 45, 0, 0, TAU); return p; }
    const o = look * 8;
    p.moveTo(-36, 6);
    p.bezierCurveTo(-42, -30, -26, -52, 0 + o * 0.3, -50);
    p.bezierCurveTo(28, -52, 44, -30, 37, 6);
    p.lineTo(31, 4);
    p.bezierCurveTo(32, -10, 26, -18, 20 + o, -20);
    p.quadraticCurveTo(12 + o, -10, 2 + o, -14);
    p.quadraticCurveTo(-8 + o, -24, -18 + o, -12);
    p.quadraticCurveTo(-26, -16, -31, 4);
    p.closePath();
  } else if (style === 'buzz') {
    if (back) { p.ellipse(0, -10, 35, 38, 0, 0, TAU); return p; }
    p.moveTo(-34, -6); p.bezierCurveTo(-36, -44, 36, -44, 34, -6); p.quadraticCurveTo(0, -30, -34, -6); p.closePath();
  } else if (style === 'curly') {
    for (let i = 0; i < 9; i++) { const a = Math.PI + i * Math.PI / 8; p.moveTo(Math.cos(a) * 34 + 12, Math.sin(a) * 38 - 8); p.arc(Math.cos(a) * 34, Math.sin(a) * 38 - 8, 12, 0, TAU); }
    if (back) p.ellipse(0, -2, 37, 42, 0, 0, TAU);
  } else if (style === 'side') {
    if (back) { p.ellipse(0, -10, 36, 40, 0, 0, TAU); return p; }
    const o = look * 6;
    p.moveTo(-35, 0); p.bezierCurveTo(-40, -40, 30, -54, 36, -6); p.lineTo(32, -10);
    p.quadraticCurveTo(10 + o, -30, -14 + o, -22); p.quadraticCurveTo(-28, -18, -30, 2); p.closePath();
  } else if (style === 'long') {
    if (back) { p.roundRect(-40, -46, 80, 112, 30); return p; }
    const o = look * 6;
    p.moveTo(-40, 60); p.bezierCurveTo(-48, -40, -20, -54, 0, -50); p.bezierCurveTo(22, -54, 48, -40, 40, 60);
    p.lineTo(28, 58); p.bezierCurveTo(34, 10, 30, -18, 6 + o, -24); p.bezierCurveTo(-18 + o, -20, -32, 10, -28, 58); p.closePath();
  } else if (style === 'cap') {
    p.moveTo(-36, -6); p.bezierCurveTo(-38, -50, 38, -50, 36, -6); p.closePath();
  }
  return p;
}

/*  P = { x, y, s, side(-1..1), back, look, tilt, walk:{ph,amp}, lean, slump, breath,
          armL:[a,b,hand], armR:[a,b,hand], legL:[a,b], legR:[a,b], sit,
          ang(0..1), worry(0..1), smile(-1..1), mouth(0..1), blink, eyeX, eyeY, style, dim } */
function person(c, P) {
  const st = P.style, s = P.s || 1;
  const f = clamp(P.side || 0, -1, 1), back = !!P.back;
  const w = 1 - 0.3 * Math.abs(f);
  const wk = P.walk || { ph: 0, amp: 0 };
  const slump = P.slump || 0;
  const bob = (1 - Math.abs(Math.cos(wk.ph))) * 9 * wk.amp;
  const hipY = -292 - bob + (P.sit ? 0 : 0);
  c.save();
  c.translate(P.x, P.y); c.scale(s, s);
  if (P.alpha !== undefined) c.globalAlpha *= P.alpha;

  // ground shadow
  if (!P.sit && !P.noShadow) {
    c.save(); c.globalAlpha *= 0.45; c.fillStyle = SHADOW;
    c.beginPath(); c.ellipse(0, 2, 70, 12, 0, 0, TAU); c.fill(); c.restore();
  }

  // ----- legs -----
  const dsign = Math.abs(f) > 0.2 ? Math.sign(f) : 0;
  const legFrom = ph => {
    if (dsign !== 0) {
      const sw = Math.sin(ph) * 0.42 * wk.amp;
      const bend = -dsign * Math.max(0, Math.cos(ph)) * 0.75 * wk.amp;
      return [dsign * sw, bend];
    }
    return [0, 0];
  };
  let legL = P.legL || legFrom(wk.ph), legR = P.legR || legFrom(wk.ph + Math.PI);
  const hipL = [-20 * w, hipY], hipR = [20 * w, hipY];
  const legPts = (hp, [a, b], ph) => {
    // front/back-view walking: foot lifts instead of swinging
    let lift = 0;
    if (dsign === 0 && !P.legL) lift = Math.max(0, Math.sin(ph)) * 34 * wk.amp;
    const [ux, uy] = dirv(a), [lx, ly] = dirv(a + b);
    const kn = [hp[0] + ux * TH, hp[1] + uy * (TH - lift * 0.4)];
    const ft = [kn[0] + lx * SH, kn[1] + ly * (SH - lift * 0.6)];
    return { kn, ft };
  };
  const LgL = legPts(hipL, legL, wk.ph), LgR = legPts(hipR, legR, wk.ph + Math.PI);
  const drawLeg = (hp, L) => {
    rimmed(c, s, (rc) => {
      limb(c, [hp, L.kn, L.ft], 42, rc || st.pants);
      // shoe
      c.fillStyle = rc || st.shoe;
      const toe = dsign !== 0 ? dsign : 0;
      c.beginPath(); c.roundRect(L.ft[0] - 20 + toe * 10, L.ft[1] - 12, 40 + Math.abs(toe) * 6, 18, 8); c.fill();
      if (!rc) { c.fillStyle = st.sole; c.fillRect(L.ft[0] - 20 + toe * 10, L.ft[1] + 2, 40 + Math.abs(toe) * 6, 4); }
    });
  };
  if (!P.hideLegs) {
    // farther leg first
    if (dsign > 0) { drawLeg(hipL, LgL); drawLeg(hipR, LgR); } else { drawLeg(hipR, LgR); drawLeg(hipL, LgL); }
  }

  // ----- upper body (leans around hip) -----
  c.translate(0, hipY);
  c.rotate(P.lean || 0);
  const br = 1 + (P.breath || 0) * 0.045;
  const shY = -196 + slump * 16;
  const shL = [-52 * w + f * 4, shY + 8], shR = [52 * w + f * 4, shY + 8];

  const armPts = (sh, arm) => {
    const [a, b] = arm; const [ux, uy] = dirv(a), [fx, fy] = dirv(a + b);
    const el = [sh[0] + ux * UA, sh[1] + uy * UA];
    const hd = [el[0] + fx * FA, el[1] + fy * FA];
    return { el, hd, ang: a + b };
  };
  const swing = Math.sin(wk.ph) * 0.4 * wk.amp;
  const armL = P.armL || [-0.08 - swing * (dsign || 1), 0.12 + 0.2 * wk.amp, 'open'];
  const armR = P.armR || [0.08 + swing * (dsign || 1), -0.12 - 0.2 * wk.amp, 'open'];
  const AL = armPts(shL, armL), AR = armPts(shR, armR);
  const drawArm = (sh, A, arm) => {
    rimmed(c, s, (rc) => {
      limb(c, [sh, A.el, A.hd], 34, rc || (st.jacket ? st.top : st.top));
      if (!rc && st.jacket) { // sleeve fold
        c.strokeStyle = st.topL; c.lineWidth = 2; c.globalAlpha *= 0.5;
        c.beginPath(); c.moveTo(lerp(A.el[0], A.hd[0], 0.75) - 12, lerp(A.el[1], A.hd[1], 0.75)); c.lineTo(lerp(A.el[0], A.hd[0], 0.75) + 12, lerp(A.el[1], A.hd[1], 0.75)); c.stroke();
        c.globalAlpha /= 0.5;
      }
    });
    rimmed(c, s, (rc) => drawHand(c, A.hd[0], A.hd[1], A.ang, arm[2] || 'open', rc || st.skin, st.skinD, arm[3] ?? 1), 0.8);
  };
  const farArm = f > 0.25 ? 'R' : f < -0.25 ? 'L' : null;
  if (back) { drawArm(shL, AL, armL); drawArm(shR, AR, armR); }
  else { if (farArm === 'R') drawArm(shR, AR, armR); if (farArm === 'L') drawArm(shL, AL, armL); }

  // torso
  const torso = new Path2D();
  const tw = w * br;
  torso.moveTo(-40 * w, 14);
  torso.bezierCurveTo(-46 * w, -60, -62 * tw, -140, -60 * tw, shY + 18);
  torso.quadraticCurveTo(-58 * tw, shY - 6, -28 * w, shY - 10);
  torso.lineTo(28 * w, shY - 10);
  torso.quadraticCurveTo(58 * tw, shY - 6, 60 * tw, shY + 18);
  torso.bezierCurveTo(62 * tw, -140, 46 * w, -60, 40 * w, 14);
  torso.closePath();
  rimmed(c, s, (rc) => {
    if (rc) { c.fillStyle = rc; c.fill(torso); return; }
    const g = c.createLinearGradient(-60 * w, 0, 60 * w, 0);
    g.addColorStop(0, mix(st.top, SHADOW, 0.35)); g.addColorStop(0.65, st.top); g.addColorStop(1, st.topL);
    c.fillStyle = g; c.fill(torso);
  });
  if (!back) {
    c.save(); c.clip(torso);
    if (st.jacket) {
      // inner tee + jacket lapels + zipper
      const cx = f * 18;
      c.fillStyle = st.inner;
      c.beginPath(); c.moveTo(cx - 20, shY - 10); c.lineTo(cx + 20, shY - 10); c.lineTo(cx + 10, -40); c.lineTo(cx - 10, -40); c.closePath(); c.fill();
      c.strokeStyle = st.topL; c.lineWidth = 3;
      c.beginPath(); c.moveTo(cx - 20, shY - 10); c.lineTo(cx - 8, 14); c.moveTo(cx + 20, shY - 10); c.lineTo(cx + 8, 14); c.stroke();
      c.strokeStyle = rgba(LIGHT.col, 0.35); c.lineWidth = 2;
      c.beginPath(); c.moveTo(cx + 9, -60); c.lineTo(cx + 8, 14); c.stroke();
    } else {
      c.strokeStyle = mix(st.top, SHADOW, 0.4); c.lineWidth = 3;
      c.beginPath(); c.arc(f * 16, shY - 12, 22, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
    }
    // hem
    c.fillStyle = mix(st.top, SHADOW, 0.3); c.fillRect(-60, 0, 120, 14);
    c.restore();
  }

  // neck + head
  const look = clamp(f * 0.75 + (P.look || 0), -1, 1);
  const hx = f * 12 + (P.look || 0) * 4, hy = shY - 62 + slump * 10;
  c.fillStyle = st.skinD; c.beginPath(); c.roundRect(hx * 0.6 - 12, shY - 34, 24, 34, 8); c.fill();
  c.save();
  c.translate(hx, hy); c.rotate((P.tilt || 0) + slump * 0.12 * (dsign || 1));
  c.translate(0, slump * 6);
  // back hair (long styles) behind head
  if ((st.hairStyle === 'long' || st.hairStyle === 'hero') && !back) {
    c.fillStyle = st.hair;
    c.beginPath(); c.ellipse(-look * 4, st.hairStyle === 'long' ? 6 : -4, 39, st.hairStyle === 'long' ? 52 : 44, 0, 0, TAU); c.fill();
  }
  // ears
  c.fillStyle = st.skinD;
  if (!back) {
    if (look < 0.7) { c.beginPath(); c.ellipse(-34 + Math.max(0, look) * 18 - Math.max(0, -look) * 6, 2, 7, 11, 0, 0, TAU); c.fill(); }
    if (look > -0.7) { c.beginPath(); c.ellipse(34 + Math.min(0, look) * 18 + Math.max(0, look) * 6, 2, 7, 11, 0, 0, TAU); c.fill(); }
  }
  const headP = new Path2D(); headP.ellipse(0, 0, 34, 42, 0, 0, TAU);
  rimmed(c, s, (rc) => {
    if (rc) { c.fillStyle = rc; c.fill(headP); return; }
    const g = c.createLinearGradient(-34, 0, 34, 0);
    g.addColorStop(0, st.skinD); g.addColorStop(0.6, st.skin); g.addColorStop(1, mix(st.skin, IVORY, 0.12));
    c.fillStyle = g; c.fill(headP);
  });
  if (!back) drawFace(c, P, look, st);
  // hair
  c.fillStyle = st.hair;
  c.fill(hairPath(c, st.hairStyle, 0, look, back));
  if (st.hairStyle === 'cap') {
    c.fillStyle = st.cap;
    c.beginPath(); c.moveTo(-37, -8); c.bezierCurveTo(-40, -54, 40, -54, 37, -8); c.closePath(); c.fill();
    if (!back) { c.beginPath(); c.ellipse(look * 26 + 6, -10, 30, 7, look * 0.2, 0, TAU); c.fill(); }
  }
  if (st.hairStyle === 'hero') { // subtle gold sheen on hair
    c.save(); c.globalAlpha *= 0.28 * LIGHT.a; c.strokeStyle = LIGHT.col; c.lineWidth = 2.5;

  }

function drawFace(c, P, look, st) {

/* ---------- camera ---------- */

}
const screen = c => c.setTransform(1, 0, 0, 1, 0, 0);

/* ---------- atmosphere helpers ---------- */

/* ---------- typography ---------- */
// words: [[text, color], ...] laid out centered on one line
function captionLine(c, words, y, size, font, k, opts = {}) {
  if (k <= 0) return;
  screen(c);
  c.save();
  c.font = `${font.weight || ''} ${size}px ${font.family}`.trim();
  c.textBaseline = 'alphabetic';
  if (opts.track) c.letterSpacing = opts.track + 'px';
  const space = c.measureText(' ').width;
  const widths = words.map(w => c.measureText(w[0]).width);
  const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
  let x = W / 2 - total / 2;
  const kk = eo(clamp(k));
  c.globalAlpha = kk * (opts.alpha ?? 1);
  const yy = y + (1 - kk) * 34;
  c.shadowColor = 'rgba(12,13,17,0.85)'; c.shadowBlur = 24;

    c.fillStyle = wd[1];
    if (wd[1] === GOLD) { c.shadowColor = rgba(GOLD, 0.45); c.shadowBlur = 30 * (opts.glow ?? 1); }
    else { c.shadowColor = 'rgba(12,13,17,0.85)'; c.shadowBlur = 24; }

}

}

/* =====================================================================
   SCENES
   ===================================================================== */
const G = 1560;   // world floor line

/* ---------- SCENE 1 — THE HOOK (0–5s) ---------- */
const CROWD_POS = [

function scene1(c, t) {

/* ---------- SCENE 2 — WHEN YOU'RE ANGRY (5–13s) ---------- */

  c.fillStyle = '#2B2620'; c.fillRect(120, tY, 380, 22); c.fillStyle = '#17161A'; c.fillRect(140, tY + 22, 18, 250); c.fillRect(462, tY + 22, 18, 250);

  c.fillStyle = '#E3DCCD'; c.beginPath(); c.roundRect(380, tY - 46 - jump, 34, 46, 5); c.fill();
  // mockers

    lean: Cslam ? 0.25 : laughC * 0.05 * Math.sin(lt * 16) + pushArm * 0.12,

/* ---------- SCENE 5 — WHEN YOU DON'T KNOW ENOUGH (29–37s) ---------- */

}
function boardDiagram(lt) {
  return c => {
    const k = seg(lt, 4.7, 6.1);
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
    // two opinions (left/right circles) → a shared insight (center)

    const a1 = seg(lt, 0.4, 1.4), a2 = seg(lt, 1.0, 2.0);
    if (a1 > 0) { c.beginPath(); c.arc(680, 720, 56, 0, TAU * a1); c.stroke(); }

      const r = seg(k, 0.35, 1);

      c.beginPath(); c.moveTo(640, 820); c.lineTo(640 + 310 * seg(k, 0.5, 1), 820); c.stroke();

}
function scene5(c, lt) {
  LIGHT = { dx: 0.7, dy: -1, rim: 3.2, a: 0.9, col: GOLD };
  // shots: wide 0–2.6 | OTS 2.6–4.3 | eyes CU 4.3–5.3 | wide-ish explain 5.3–6.0 | notebook CU 6.0–7.1 | medium face 7.1–8
  const shot = lt < 2.6 ? 'wide' : lt < 4.3 ? 'ots' : lt < 5.3 ? 'eyes' : lt < 6.0 ? 'wide2' : lt < 7.1 ? 'nb' : 'face';

  const heroY = G + 40, heroS = 1.08;

  else if (shot === 'eyes') cam = { x: hx + 12, y: heroY - (292 + 196 + 62) * heroS + 4, z: K(lt, [[4.3, 5.2], [5.3, 5.6, lin]]) };
  else if (shot === 'wide2') cam = { x: 600, y: G - 400, z: 1.35 };

  else cam = { x: hx + 40, y: heroY - 520, z: K(lt, [[7.1, 2.4], [8, 2.2, lin]]) };

  meetingRoom(c, cam, boardDiagram(lt));
  setCam(c, cam);
  floorGrad(c, G - 60, '#22242B', '#0E0F13');
  // table in the room
  const tbY = G - 260;
  // arguing pair E & F, explainer G
  const eTalk = Math.sin(lt * 2.2) > 0 && lt < 4.7, fTalk = !eTalk && lt < 4.7;
  const gTalk = lt > 4.6 && lt < 6.4;
  person(c, { x: 900, y: G - 40, s: 0.9, side: -0.35, style: STY.g,
    armR: gTalk ? [K(lt, [[4.6, 0.1], [5.0, -0.2]]), K(lt, [[4.6, 0], [5.0, -1.5]]) + Math.sin(lt * 5) * 0.2, 'open'] : [0.1, -0.1, 'open'],
    armL: gTalk ? [-0.6 + Math.sin(lt * 4) * 0.15, 1.5, 'open'] : [-0.1, 0.1, 'open'],
    mouth: gTalk ? talk(lt, 12) * 0.6 : 0, smile: 0.2, blink: blink(lt, 101), look: -0.2, eyeX: lt < 4.6 ? -0.6 : -0.9 });
  person(c, { x: 470, y: G, s: 1.0, side: 0.6, style: STY.e, hideLegs: true,
    armR: eTalk ? [0.9 + Math.sin(lt * 9) * 0.25, -1.2, 'open'] : [0.25, -0.5, 'open'], armL: [-0.15, 0.4, 'open'],
    ang: eTalk ? 0.6 : 0.3, mouth: eTalk ? talk(lt, 13) * 0.8 : 0, blink: blink(lt, 111), lean: eTalk ? 0.06 : 0,
    look: gTalk ? 0.3 : 0, eyeX: gTalk ? 1 : 1 });
  person(c, { x: 760, y: G, s: 1.0, side: -0.6, style: STY.fz, hideLegs: true,
    armL: fTalk ? [-0.9 - Math.sin(lt * 9) * 0.25, 1.2, 'open'] : [-0.25, 0.5, 'open'], armR: [0.15, -0.4, 'open'],
    ang: fTalk ? 0.6 : 0.3, mouth: fTalk ? talk(lt, 14) * 0.8 : 0, blink: blink(lt, 121), lean: fTalk ? -0.06 : 0,
    eyeX: gTalk ? 1 : -1, look: gTalk ? 0.4 : 0 });
  c.fillStyle = '#2B2620'; c.fillRect(330, tbY, 600, 26); c.fillStyle = rgba(GOLD, 0.25); c.fillRect(330, tbY, 600, 3);
  c.fillStyle = '#17161A'; c.fillRect(340, tbY + 26, 580, 300);

  const understand = seg(lt, 6.6, 7.4);
  const uncertain = seg(lt, 0.9, 1.6) * (1 - seg(lt, 5.6, 6.6));
  const eyeDart = lt < 4.6 ? (Math.sin(lt * 2.2) > 0 ? -0.2 : 1) : 1;
  const writing = lt > 6.0 && lt < 7.1;
  const hero = {
    x: shot === 'ots' ? 300 : hx, y: shot === 'ots' ? G + 320 : heroY, s: shot === 'ots' ? 1.75 : heroS,

    const wk = seg(lt, 6.15, 6.95);
    c.font = '600 22px Poppins'; c.fillStyle = '#252830'; c.textBaseline = 'middle';

    c.save(); c.beginPath(); c.rect(-140, -26, 280 * seg(lt, 6.55, 7.0), 40); c.clip(); c.fillStyle = '#9C7630'; c.fillText('Then speak.', -130, -6); c.restore();
    c.strokeStyle = '#B98A35'; c.lineWidth = 3; c.beginPath(); c.moveTo(-130, 14); c.lineTo(-130 + 150 * seg(lt, 6.85, 7.05), 14); c.stroke();

    c.restore();
  }
  if (shot === 'face' && lt > 7.45) {
    // closing the notebook in hand (snap)
  }
  vignette(c, 0.7);
  // "?" of uncertainty near hero (subtle, wide shot only)
  if (shot === 'wide' && uncertain > 0) { setCam(c, cam); c.save(); c.globalAlpha = uncertain * 0.5; c.fillStyle = IVORY; c.font = '700 54px Poppins'; c.fillText('?', hx + 60, heroY - 680); c.restore(); }
  // entrance dissolve
  const inK = seg(lt, 0, 0.5);
  if (inK < 1) { screen(c); c.fillStyle = `rgba(23,25,31,${0.9 * (1 - eio(inK))})`; c.fillRect(0, 0, W, H); }
  // cut flashes between shots (soft)
  for (const tc of [2.6, 4.3, 5.3, 6.0, 7.1]) { const d = lt - tc; if (d >= 0 && d < 0.12) { screen(c); c.fillStyle = `rgba(12,13,17,${0.5 * (1 - d / 0.12)})`; c.fillRect(0, 0, W, H); } }
  const k = capK(lt, 4.4, 7.7);
  captionLine(c, [['LISTEN', IVORY], ['MORE.', IVORY]], 290, 120, BEBAS, k, { track: 5 });
  captionLine(c, [['LEARN', GOLD], ['MORE.', GOLD]], 440, 160, BEBAS, capK(lt, 4.7, 7.7), { track: 8 });
  // closing beat: fade toward gold
  const out = seg(lt, 7.5, 8.0);
  if (out > 0) { screen(c); c.fillStyle = `rgba(12,13,17,${eio(out) * 0.85})`; c.fillRect(0, 0, W, H); }
}

/* ---------- SCENE 6 — POWERFUL ENDING (37–45s) ---------- */
function scene6(c, lt) {
  const warm = seg(lt, 0.5, 4.5);
  LIGHT = { dx: 0, dy: -1, rim: 4 + warm * 3, a: 0.7 + 0.3 * warm, col: GOLD };
  screen(c);
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mix('#0C0D11', '#2A2416', warm * 0.8)); g.addColorStop(0.45, mix('#121318', '#3A2F18', warm)); g.addColorStop(1, '#0C0D11');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // horizon glow
  const hzY = lerp(860, 900, warm);
  glow(c, W / 2, hzY, lerp(300, 900, warm), GOLD, lerp(0.15, 0.55, warm));
  // golden pathway (perspective) — widens as camera pulls back
  const pull = eio(seg(lt, 2.0, 5.6));
  const nearW = lerp(1700, 900, pull), farW = lerp(60, 30, pull);
  c.save();
  const pg = c.createLinearGradient(0, hzY, 0, H);
  pg.addColorStop(0, rgba(GOLD, 0.85)); pg.addColorStop(1, rgba(GOLD, 0.08 + 0.12 * warm));
  c.fillStyle = pg;
  c.beginPath(); c.moveTo(W / 2 - farW / 2, hzY); c.lineTo(W / 2 + farW / 2, hzY); c.lineTo(W / 2 + nearW / 2, H); c.lineTo(W / 2 - nearW / 2, H); c.closePath();
  c.globalAlpha = lerp(0.25, 0.9, warm); c.fill();
  // path stripes moving toward horizon (walking motion)
  c.globalAlpha = 0.25 * warm; c.fillStyle = IVORY;
  for (let i = 0; i < 10; i++) {
    const z = ((i / 10 + lt * 0.08) % 1), yy = hzY + (H - hzY) * Math.pow(1 - z, 2.2);
    const ww = lerp(farW, nearW, Math.pow(1 - z, 2.2));
    c.fillRect(W / 2 - ww * 0.01, yy, ww * 0.02, 6 * (1 - z));
  }
  c.restore();
  // distractions dissolving: ghost silhouettes, speech marks, phone glows at the sides
  for (let i = 0; i < 8; i++) {
    const side = i % 2 ? 1 : -1;
    const d = seg(lt, 0.3 + i * 0.35, 1.0 + i * 0.35);
    const a = (1 - d) * 0.5;
    if (a <= 0) continue;
    const x = W / 2 + side * (300 + hash(i) * 160), y = 1250 + hash(i + 4) * 300;
    c.save(); c.globalAlpha = a; c.filter = `blur(${2 + d * 10}px)`;
    LIGHT = { dx: -side, dy: -0.5, rim: 3, a: 0.4, col: GOLD };
    person(c, { x, y: y + 300, s: 0.75, side: -side * 0.6, style: CROWD[i % 8], ang: 0.5, mouth: talk(lt, i) * 0.8, noShadow: true,
      armR: [0.6 + 0.4 * Math.sin(lt * 5 + i), -1.4, 'open'], armL: [-0.4, 1.2, 'open'] });

    c.restore();
  }
  LIGHT = { dx: 0, dy: -1, rim: 4 + warm * 3, a: 0.7 + 0.3 * warm, col: GOLD };
  // hero walks away along the path (rear view), shrinking into depth
  const dist = lt * 0.11;
  const hs = lerp(1.25, 0.32, pull) * (1 - dist * 0.35);
  const hy = lerp(H + 120, hzY + 360, pull) - dist * 260 * (1 - pull);
  const fade = 1 - seg(lt, 5.2, 5.9);
  if (fade > 0) {
    c.save(); c.globalAlpha = fade;
    person(c, { x: W / 2, y: hy, s: hs, side: 0, back: true, style: STY.hero, walk: { ph: lt * 5.6, amp: 1 }, noShadow: false });
    c.restore();
  }
  dust(c, lt, 40, 7, { x: 0, y: 500, w: W, h: 1100 }, GOLD, 0.35 * warm);
  vignette(c, 0.8);
  // fade to clean dark
  const dark = seg(lt, 5.1, 5.9);
  if (dark > 0) { screen(c); c.fillStyle = `rgba(23,25,31,${eio(dark)})`; c.fillRect(0, 0, W, H); }
  // final words
  const k1 = seg(lt, 5.7, 6.3), k2 = seg(lt, 6.4, 7.0);
  captionLine(c, [['SPEAK', IVORY], ['WITH', IVORY], ['PURPOSE.', IVORY]], 880, 112, BEBAS, k1, { track: 6 });
  accentRule(c, 940, seg(lt, 6.2, 6.7), 120);
  captionLine(c, [['STAY', GOLD], ['SILENT', GOLD]], 1100, 168, BEBAS, k2, { track: 8 });
  captionLine(c, [['WITH', GOLD], ['POWER.', GOLD]], 1260, 168, BEBAS, seg(lt, 6.6, 7.2), { track: 8, glow: 1 + 0.4 * Math.sin(lt * 3) });
}

/* =====================================================================
   MASTER TIMELINE
   ===================================================================== */
const SCENES = [
  [0, 5, scene1], [5, 13, scene2], [13, 21, scene3], [21, 29, scene4], [29, 37, scene5], [37, 45, scene6],
];
function renderAt(t) {
  t = clamp(t, 0, DURATION - 1e-4);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  for (const [a, b, fn] of SCENES) if (t >= a && t < b) { ctx.save(); fn(ctx, a === 0 ? t : t - a); ctx.restore(); }
  ctx.save(); wipe(ctx, t); ctx.restore();
  grain(ctx, t);
}
window.renderAt = renderAt;
window.DURATION = DURATION;

/* ---------- playback ---------- */
const params = new URLSearchParams(location.search);
window.ready = document.fonts.load("100px 'Bebas Neue'").then(() => Promise.all([document.fonts.load('600 20px Poppins'), document.fonts.load('700 20px Poppins')]));
if (params.has('capture')) {
  window.ready.then(() => renderAt(0));
} else if (params.has('t')) {
  window.ready.then(() => renderAt(parseFloat(params.get('t'))));
} else {
  let start = performance.now();
  const loop = () => { renderAt(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
  window.ready.then(loop);
  canvas.addEventListener('click', () => { start = performance.now(); });

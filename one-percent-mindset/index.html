<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 1% Mindset</title>
<style>
  @font-face { font-family: 'Anton'; src: url(fonts/Anton.woff2) format('woff2'); }
  @font-face { font-family: 'Bebas Neue'; src: url(fonts/BebasNeue.woff2) format('woff2'); }
  @font-face { font-family: 'InterB'; src: url(fonts/Inter-Bold.otf) format('opentype'); }
  @font-face { font-family: 'InterK'; src: url(fonts/Inter-Black.otf) format('opentype'); }
  @font-face { font-family: 'JBMono'; src: url(fonts/JetBrainsMono-Bold.ttf) format('truetype'); }
  html, body { margin: 0; height: 100%; background: #0A0A0A; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; display: block; cursor: pointer; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920" title="Click to play / pause"></canvas>
<script>
/* =====================================================================
   THE 1% MINDSET — 47s animated Instagram Reel (1080x1920, 9:16)
   Stick-figure 2D animation, drawn procedurally on a canvas.
   renderAt(t) draws the frame at time t (seconds) — fully deterministic.
   Every character, prop, UI and title is an editable function below.
   ===================================================================== */
const W = 1080, H = 1920, DURATION = 47, FPS = 30;
const C = { bg: '#0A0A0A', pri: '#1C1C1C', amb: '#FF2D2D', sec: '#7A7A7A', txt: '#F2F2F2', warn: '#FF2D2D' };
const FK = 'InterK', FM = 'JBMono';
const FA = 'Anton', FB = '"Bebas Neue"', FI = 'InterB';
// Scene windows (seconds) — retimed from the 53s script to 47s
const SCN = [[0, 4], [4, 9.5], [9.5, 15], [15, 20.5], [20.5, 26], [26, 31], [31, 36], [36, 41.5], [41.5, 47]];

const canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');
let NOTEXT = false, SCENE_TITLES = false;

/* ---------------- math / easing ---------------- */
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (u, a, b) => clamp((u - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3);

const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const esine = k => -(Math.cos(Math.PI * k) - 1) / 2;
const eob = k => { const c1 = 1.5, c3 = c1 + 1; return k <= 0 ? 0 : k >= 1 ? 1 : 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };

const pulse = (u, a, b, fi = .2, fo = .2) => Math.min(seg(u, a, a + fi), 1 - seg(u, b - fo, b));

  const r = Math.round(lerp(a >> 16 & 255, b >> 16 & 255, k)), g = Math.round(lerp(a >> 8 & 255, b >> 8 & 255, k)), bl = Math.round(lerp(a & 255, b & 255, k));

function mixAny(A, B, k) {

// keyframe track: keys = [[time, value], ...]
function track(u, keys, e = eio) {
  if (u <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [a, A] = keys[i], [b, Bv] = keys[i + 1];
    if (u <= b) return mixAny(A, Bv, e(seg(u, a, b)));

}

/* ---------------- drawing helpers ---------------- */
let CAM = { x: 540, y: 960, z: 1 };
function cam(x, y, z, fn, sx = W / 2, sy = H / 2) {
  const prev = CAM; CAM = { x, y, z, sx, sy };
  ctx.save(); ctx.translate(sx, sy); ctx.scale(z, z); ctx.translate(-x, -y); fn(); ctx.restore();
  CAM = prev;
}
const w2s = (px, py, c = CAM) => [(px - c.x) * c.z + (c.sx ?? W / 2), (py - c.y) * c.z + (c.sy ?? H / 2)];
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

  stops.forEach(([o, c]) => g.addColorStop(o, c)); return g;
}

  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function polyline(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); }
function stroke(pts, w, col, rim, rimW) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (rim) { polyline(pts); ctx.strokeStyle = rim; ctx.lineWidth = w + rimW * 2; ctx.stroke(); }
  polyline(pts); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function text(str, x, y, size, col, font = FI, align = 'center', base = 'middle', ls = 0) {
  ctx.font = `${size}px ${font}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.letterSpacing = ls + 'px'; ctx.fillText(str, x, y); ctx.letterSpacing = '0px';

// draw something in a reference coordinate space (refW wide) mapped into rect x,y,w
function ui(x, y, w, refW, fn) { ctx.save(); ctx.translate(x, y); const k = w / refW; ctx.scale(k, k); fn(); ctx.restore(); }
const LAY = {};
function layer(n) {
  if (!LAY[n]) { const c = document.createElement('canvas'); c.width = W; c.height = H; LAY[n] = c; }
  const x = LAY[n].getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.filter = 'none';
  x.globalCompositeOperation = 'source-over'; x.clearRect(0, 0, W, H); return x;
}
function into(c2, fn) { const p = ctx; ctx = c2; fn(); ctx = p; }
function blit(n, blur = 0, alpha = 1) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = alpha;
  if (blur > .05) ctx.filter = `blur(${blur.toFixed(2)}px)`;
  ctx.drawImage(LAY[n], 0, 0); ctx.restore();
}
function checkMark(x, y, s, col, w = 6) {
  ctx.beginPath(); ctx.moveTo(x - s * .5, y); ctx.lineTo(x - s * .12, y + s * .38); ctx.lineTo(x + s * .55, y - s * .4);
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}
function heart(x, y, s, col) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x - s * .9, y - s * .25, x - s * .45, y - s * .85, x, y - s * .35);
  ctx.bezierCurveTo(x + s * .45, y - s * .85, x + s * .9, y - s * .25, x, y + s * .35);
  ctx.fillStyle = col; ctx.fill();
}

/* =====================================================================
   CHARACTER RIG  (stick figure with hoodie + messy hair)
   Angles in radians: 0 = straight down, + = toward facing direction.
   ===================================================================== */
const B = { L1: 92, L2: 92, T: 150, N: 16, R: 44, A1: 74, A2: 68 };
const P0 = { x: 540, y: 1600, s: 1, f: 1, thL: -.06, thR: .06, knL: .06, knR: .06, lean: 0, nod: 0, uaL: .06, elL: .14, uaR: -.04, elR: .14,
  look: .7, blink: 0, glint: 1, mood: 0, brow: 0, gazeY: 0, breath: 0, hunch: 0, wL: 0, wR: 0, tL: [0, 0], tR: [0, 0], liftL: 0, liftR: 0, rim: 0, sway: 0 };
const P = (...o) => Object.assign({}, P0, ...o);
// The main character's look — never changes between scenes
const HERO = { skin: '#CC2626', skinD: '#A01F1F', hair: '#090909', style: 'messy', top: '#343434', topD: '#282828', topRim: '#545454',
  pants: '#181818', pantsD: '#111111', pantsRim: '#424242', shoe: '#E8E8E8', sole: '#939393', iris: '#363636', hood: true };

function ik(S, T, a, b, ff) {
  const dx = T[0] - S[0], dy = T[1] - S[1];
  const d = Math.hypot(dx, dy) || .001, dm = Math.min(d, a + b - .5);
  const th = Math.atan2(dy, dx), al = Math.acos(clamp((a * a + dm * dm - b * b) / (2 * a * dm), -1, 1));
  const e1 = [S[0] + a * Math.cos(th + al), S[1] + a * Math.sin(th + al)], e2 = [S[0] + a * Math.cos(th - al), S[1] + a * Math.sin(th - al)];
  const c1 = dx * (e1[1] - S[1]) - dy * (e1[0] - S[0]);
  const e = Math.sign(c1) === Math.sign(ff) ? e1 : e2;
  return [e, [S[0] + dm * Math.cos(th), S[1] + dm * Math.sin(th)]];
}
function J(p) {
  const s = p.s, fr = !!(p.front || p.back), f = p.f;
  const fL = fr ? -1 : f, fR = fr ? 1 : f;
  const oL = fr ? -12 : 0, oR = fr ? 12 : 0;
  const leg = (th, kn, ff, off, lift) => {
    const k = [off + Math.sin(th) * ff * B.L1, Math.cos(th) * B.L1 - lift * .5];
    return [k, [k[0] + Math.sin(th - kn) * ff * B.L2, k[1] + Math.cos(th - kn) * B.L2 - lift * .5]];
  };
  const [kL, aL] = leg(p.thL, p.knL, fL, oL, p.liftL), [kR, aR] = leg(p.thR, p.knR, fR, oR, p.liftR);
  const T = B.T * (1 + p.breath * .035);
  const lean = fr ? 0 : p.lean + p.hunch * .18;
  const neck = [Math.sin(lean) * f * T + (fr ? p.sway : 0), -Math.cos(lean) * T];
  const ha = fr ? 0 : lean + p.nod + p.hunch * .25;
  const hd = B.N + B.R;
  const head = fr ? [neck[0], neck[1] - hd + p.nod * 7] : [neck[0] + Math.sin(ha) * f * hd, neck[1] - Math.cos(ha) * hd];
  const shY = 14 - p.breath * 5 + p.hunch * 5;
  const shL = fr ? [neck[0] - 23, neck[1] + shY] : [neck[0] - Math.sin(lean) * f * shY - f * p.hunch * 5, neck[1] + Math.cos(lean) * shY];
  const shR = fr ? [neck[0] + 23, neck[1] + shY] : shL.slice();
  const hx = p.x, hy = p.hipY != null ? p.hipY : p.y - Math.max(aL[1], aR[1]) * s - 9 * s;
  const w = v => [hx + v[0] * s, hy + v[1] * s];
  const o = { s, f, fr, back: !!p.back, hip: [hx, hy], hipL: w([oL, 0]), hipR: w([oR, 0]), kL: w(kL), aL: w(aL), kR: w(kR), aR: w(aR),
    neck: w(neck), head: w(head), ha, shL: w(shL), shR: w(shR) };
  const arm = (sh, ua, el, ff, wt, tg) => {
    const e = [sh[0] + Math.sin(ua) * ff * B.A1 * s, sh[1] + Math.cos(ua) * B.A1 * s];
    const h = [e[0] + Math.sin(ua + el) * ff * B.A2 * s, e[1] + Math.cos(ua + el) * B.A2 * s];
    if (wt > 0) return ik(sh, [lerp(h[0], tg[0], wt), lerp(h[1], tg[1], wt)], B.A1 * s, B.A2 * s, ff);
    return [e, h];
  };
  [o.eL, o.hL] = arm(o.shL, p.uaL, p.elL, fL, p.wL, p.tL);
  [o.eR, o.hR] = arm(o.shR, p.uaR, p.elR, fR, p.wR, p.tR);
  return o;
}
// world position of an eye (which: 1 = near / right eye)
function eyePos(p, which = 1) {
  const j = J(p), lk = p.front ? 0 : p.look, sp = 24 * (1 - lk * .55);
  const ex = lk * 18 + (which ? sp / 2 : -sp / 2), ey = -2 + p.gazeY;
  const sx = (j.fr ? 1 : j.f) * j.s, r = j.fr ? 0 : j.ha * j.f;
  const x = ex * sx, y = ey * j.s, c = Math.cos(r), sn = Math.sin(r);
  return [j.head[0] + x * c - y * sn, j.head[1] + x * sn + y * c];
}
const TUFT = [.9, .35, 1, .55, .95, .4, .8, .6];
function hairShape(lk, look, back) {
  const R = B.R;
  ctx.fillStyle = look.hair; ctx.strokeStyle = look.hairLine || look.hair; ctx.lineWidth = look.hairLine ? 3.5 : 3; ctx.lineJoin = 'round';
  if (look.hairLine) { ctx.save(); hairShapeRaw(lk, look, back, true); ctx.restore(); }
  hairShapeRaw(lk, look, back, false);
}
function hairShapeRaw(lk, look, back, outline) {
  const R = B.R;
  if (outline) { ctx.strokeStyle = look.hairLine; ctx.lineWidth = 8; ctx.fillStyle = look.hairLine; } else { ctx.fillStyle = look.hair; ctx.strokeStyle = look.hair; ctx.lineWidth = 1; }
  const F = () => { ctx.fill(); if (outline) ctx.stroke(); };
  if (back) {
    ctx.beginPath(); ctx.arc(0, 0, R + 4, Math.PI * .86, Math.PI * 2.14); ctx.closePath(); F();
    ctx.beginPath(); ctx.rect(-R - 4, -2, 2 * R + 8, R * .55); F();
  } else {

    ctx.beginPath(); ctx.arc(-lk * 4, 0, R + 4, Math.PI + .12, TAU - .1 + lk * .05);
    ctx.quadraticCurveTo(lk * 10, -R * .32, -R - 2 - lk * 2, -2); ctx.closePath(); F();
    // back of head (profile)
    if (lk > .25) {
      const a0 = Math.PI * (1 - .42 * clamp((lk - .25) / .75));
      ctx.beginPath(); ctx.arc(0, 0, R + 3, a0, Math.PI * 1.45); ctx.lineTo(-R * .1, -R * .2); ctx.closePath(); F();
    }
    // fringe
    const fx = lk * 16;
    ctx.beginPath();
    ctx.moveTo(fx - 26, -R * .62); ctx.lineTo(fx - 16, -R * .3); ctx.lineTo(fx - 8, -R * .55); ctx.lineTo(fx + 2, -R * .22);
    ctx.lineTo(fx + 10, -R * .5); ctx.lineTo(fx + 22, -R * .32 + lk * 4); ctx.lineTo(fx + 26, -R * .7); ctx.closePath(); F();
  }
  if (look.style === 'messy' || back) {
    for (let i = 0; i < 8; i++) {
      const a = lerp(Math.PI + .3, TAU - .25, i / 7), tl = 9 + TUFT[i] * 9;
      const bx = Math.cos(a) * (R + 1), by = Math.sin(a) * (R + 1), d = .24;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - d) * (R + 1), Math.sin(a - d) * (R + 1));
      ctx.lineTo(bx + Math.cos(a - .5) * tl, by + Math.sin(a - .5) * tl);
      ctx.lineTo(Math.cos(a + d) * (R + 1), Math.sin(a + d) * (R + 1)); ctx.closePath(); F();

    for (let i = 0; i < 7; i++) { const a = lerp(Math.PI + .2, TAU - .2, i / 6); ctx.beginPath(); ctx.arc(Math.cos(a) * (R + 2), Math.sin(a) * (R + 2), 11, 0, TAU); F(); }

}
const INK = '#F2F2F2', RED = '#FF2D2D', BG = '#0A0A0A';
function heroCol(p, look) { return look.line || mixCol(INK, RED, clamp(p.red || 0)); }
function drawHead(j, p, look, col) {
  const R = B.R, s = j.s, lk = j.fr ? 0 : p.look;
  ctx.save(); ctx.translate(j.head[0], j.head[1]); ctx.rotate(j.fr ? 0 : j.ha * j.f); ctx.scale((j.fr ? 1 : j.f) * s, s);

    if (p.blink > .65) {
      ctx.beginPath(); ctx.moveTo(x - 5.5, ey + 1); ctx.quadraticCurveTo(x, ey + 4, x + 5.5, ey + 1);
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();

      ctx.beginPath(); ctx.ellipse(x, ey, 4.8, ry, 0, 0, TAU); ctx.fillStyle = col; ctx.fill();

}
function torsoPts(j, hunch) {

}
// line-art stick figure: white ink, turns red (p.red) at his decision moment
function drawPerson(p, look = HERO) {
  const j = J(p), s = j.s, col = heroCol(p, look), far = mixCol(col, BG, .4), lw = 6 * s;
  ctx.save();

  const handDot = (h, c) => { ctx.beginPath(); ctx.arc(h[0], h[1], 5.5 * s, 0, TAU); ctx.fillStyle = c; ctx.fill(); };
  const foot = (a, c) => { if (j.fr) L([[a[0] - 7 * s, a[1] + 4 * s], [a[0] + 7 * s, a[1] + 4 * s]], c); else L([[a[0] - j.f * 4 * s, a[1] + 4 * s], [a[0] + j.f * 15 * s, a[1] + 4 * s]], c); };

  if (j.fr) {
    L([j.hipL, j.kL, j.aL]); L([j.hipR, j.kR, j.aR]); foot(j.aL, col); foot(j.aR, col);
    L([j.hipL, j.hipR]);
    L([[j.hip[0], j.hip[1]], [j.neck[0], j.neck[1] + 8 * s]]);
    if (look.hood !== false) {

function wrapText(str, x, y, maxW, size, col, lh = 1.35) {
  ctx.font = `${size}px ${FI}`; const words = str.split(' '); let line = '', yy = y;
  for (const w of words) { const tl = line ? line + ' ' + w : w; if (ctx.measureText(tl).width > maxW && line) { text(line, x, yy, size, col, FI, 'left', 'top'); line = w; yy += size * lh; } else line = tl; }
  if (line) text(line, x, yy, size, col, FI, 'left', 'top'); return yy + size * lh;
}

}

window.renderAt = renderAt; window.DURATION = DURATION;
const q = new URLSearchParams(location.search);
init().then(() => {

  if (q.has('t')) { renderAt(parseFloat(q.get('t'))); return; }
  let start = performance.now(), paused = false, pauseT = 0;
  canvas.onclick = () => { if (paused) { start = performance.now() - pauseT * 1000; paused = false; } else { pauseT = (performance.now() - start) / 1000 % DURATION; paused = true; } };
  (function loop() { if (!paused) renderAt(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); })();

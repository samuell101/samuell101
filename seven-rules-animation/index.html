<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seven Rules</title>
<style>
  :root { --navy:#101827; --ivory:#F5F0E6; --orange:#FF9F43; }
  html, body { margin:0; height:100%; background:var(--navy); overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { width:100vw; height:56.25vw; max-height:100vh; max-width:177.78vh; display:block; cursor:pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080" title="Click to replay"></canvas>
<script>
/* ------------------------------------------------------------------
   Seven Rules — premium minimalist 2D motion graphic
   Palette: navy #101827 (bg), ivory #F5F0E6, orange #FF9F43 only.
   Fully deterministic: renderAt(t) draws the frame at time t (seconds).
------------------------------------------------------------------- */
const W = 1920, H = 1080, G = 760;           // G = floor line (world y)
const NAVY = '#101827', IVORY = '#F5F0E6', ORANGE = '#FF9F43';
const DURATION = 11.2;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

/* ---------- math / easing ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eo = k => 1 - Math.pow(1 - k, 3);
const esine = k => -(Math.cos(Math.PI * k) - 1) / 2;
const eob = k => { const c1 = 1.4, c3 = c1 + 1; return k <= 0 ? 0 : 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const TAU = Math.PI * 2;
// constant-speed walk that decelerates softly into a stop
const walkIn = k => { const v = 1 / 0.85; return k < 0.7 ? v * k : v * 0.7 + v * (k - 0.7) - v * (k - 0.7) ** 2 / 0.6; };
// walk with short acceleration / deceleration
const walkIO = k => { const a = 0.22, v = 1 / (1 - a);
  if (k < a) return v * k * k / (2 * a);
  if (k > 1 - a) { const r = 1 - k; return 1 - v * r * r / (2 * a); }
  return v * a / 2 + v * (k - a); };

/* ---------- character path ---------- */
const XSEG = [
  [0.00, 1.80, -70, 960, walkIn],   // enters, stops at center
  [4.60, 5.90, 960, 1110, walkIO],  // toward the bed with phone
  [6.12, 7.20, 1110, 680, walkIO],  // toward the door
  [8.20, 8.92, 680, 1060, walkIO],  // back to the bed
];
function charX(t) {
  let x = XSEG[0][2];
  for (const [a, b, x0, x1, e] of XSEG) if (t >= a) x = lerp(x0, x1, e(seg(t, a, b)));
  return x;
}
function charDist(t) {
  let d = 0;
  for (const [a, b, x0, x1, e] of XSEG) d += Math.abs(x1 - x0) * e(seg(t, a, b));
  return d;
}
function charFace(t) {
  let f = 1;
  f = lerp(f, -1, esine(seg(t, 5.92, 6.12)));
  f = lerp(f, 1, esine(seg(t, 8.04, 8.20)));
  f = lerp(f, -1, esine(seg(t, 8.95, 9.12)));
  return f;
}

/* ---------- layout constants ---------- */
const HEAD_C = { x: 960, y: 470 };           // orbit center (around the head)
const RING = { x: 960, y: 540, r: 260 };
const WALL = { x: 1040, y: 470, hw: 710, hh: 290, r: 18 };
const DOOR = { x: 420, y: 340, w: 180, h: 420 };
const FRAME_TARGET = { x: 760, y: 90, w: 560, h: 900 };
const WINDOW = { x: 1150, y: 250, w: 200, h: 170 };
const MOON_HOME = { x: 1302, y: 296 };
const TABLE_TOP_Y = 650;
const PHONE_REST = { x: 510, y: 645 };
const LIE_P = { x: 1178, y: 600 };
const ICONS = ['circle', 'triangle', 'square', 'diamond', 'hex', 'plus', 'moon'];
function arcPos(i) {
  const a = (-150 + i * 20) * Math.PI / 180;
  return { x: 960 + Math.cos(a) * 185, y: 498 + Math.sin(a) * 185 };
}

/* ---------- character pose ---------- */
const LU = 62, LL = 62, AU = 52, AL = 48;
const dir = a => [Math.sin(a), Math.cos(a)];   // angle from straight down, + = forward

function poseAt(t) {
  const x = charX(t);
  const v = (charX(t + 0.01) - charX(t - 0.01)) / 0.02;
  const amp = clamp(Math.abs(v) / 260);
  const phase = charDist(t) / 150 * Math.PI;
  const face = charFace(t);

  // placement (standing vs lying on bed)
  const lk = eio(seg(t, 8.92, 9.36));
  const px = lerp(x, LIE_P.x, lk);
  const py = lerp(G, LIE_P.y, lk) - Math.sin(Math.PI * lk) * 46;
  const rot = Math.PI / 2 * lk;

  // arms: [upper angle, elbow bend]
  const sw = Math.sin(phase) * 0.55 * amp;
  let front = [sw + 0.06, 0.25 + 0.25 * amp];
  let back = [-sw + 0.06, 0.25 + 0.25 * amp];

  // point at highlighted icon
  const wPoint = eio(seg(t, 2.45, 2.85)) * (1 - eio(seg(t, 4.0, 4.4)));
  if (wPoint > 0) {
    const sx = x, sy = G - 124 - 102 + 6;
    const m = arcPos(6);
    const a = Math.atan2((m.x - sx) * face, (m.y - sy));
    front = [lerp(front[0], a - 0.04, wPoint), lerp(front[1], 0.02, wPoint)];
  }
  // hold the phone
  const wHold = eio(seg(t, 4.3, 4.6)) * (1 - eio(seg(t, 7.2, 7.36)));
  front = [lerp(front[0], 0.35, wHold), lerp(front[1], 1.25, wHold)];
  // reach out and place it
  const wReach = eio(seg(t, 7.2, 7.36)) * (1 - eio(seg(t, 7.5, 7.9)));
  front = [lerp(front[0], 1.0, wReach), lerp(front[1], 0.0, wReach)];
  // relax on bed
  const wLie = eio(seg(t, 8.9, 9.3));
  front = [lerp(front[0], 0.12, wLie), lerp(front[1], 0.15, wLie)];
  back = [lerp(back[0], 0.12, wLie), lerp(back[1], 0.15, wLie)];

  const breathe = wLie * Math.sin(t * 4.2) * 0.5 + 0.5 * wLie;
  return { x, px, py, rot, face, amp: amp * (1 - lk), phase, front, back, breathe, lie: lk };
}

function skeleton(p) {
  const hipY = -124 + Math.abs(Math.sin(p.phase)) * 7 * p.amp;
  const shY = hipY - 102;
  const sh = [0, shY + 6];
  const arm = ([a, b]) => {
    const [ux, uy] = dir(a), [fx, fy] = dir(a + b);
    const el = [sh[0] + ux * AU, sh[1] + uy * AU];
    const hd = [el[0] + fx * AL, el[1] + fy * AL];
    return { el, hd, fdir: [fx, fy] };
  };
  const leg = ph => {
    const th = Math.sin(ph) * 0.55 * p.amp;
    const bend = Math.max(0, Math.cos(ph)) * 0.9 * p.amp + 0.04;
    const [tx, ty] = dir(th), [sx, sy] = dir(th - bend);
    const kn = [tx * LU, hipY + ty * LU];
    const ft = [kn[0] + sx * LL, kn[1] + sy * LL];
    return { kn, ft };
  };
  return { hipY, shY, sh, armF: arm(p.front), armB: arm(p.back), legF: leg(p.phase), legB: leg(p.phase + Math.PI) };
}

function toWorld(p, lx, ly) {
  const x = lx * p.face, c = Math.cos(p.rot), s = Math.sin(p.rot);
  return [p.px + x * c - ly * s, p.py + x * s + ly * c];
}

function drawChar(c, p) {
  const k = skeleton(p);
  c.save();
  c.translate(p.px, p.py);
  c.rotate(p.rot);
  c.scale(p.face, 1);
  c.lineCap = 'round'; c.lineJoin = 'round';

  // soft ground shadow (standing only)
  if (p.lie < 0.5) {
    c.save(); c.globalAlpha = 0.07 * (1 - p.lie * 2); c.fillStyle = IVORY;
    c.beginPath(); c.ellipse(0, 2, 46, 6, 0, 0, TAU); c.fill(); c.restore();
  }

  const drawArm = (a, alpha) => {
    c.save(); c.globalAlpha *= alpha;
    const wr = [a.hd[0] - a.fdir[0] * 7, a.hd[1] - a.fdir[1] * 7];
    c.strokeStyle = ORANGE; c.lineWidth = 15;
    c.beginPath(); c.moveTo(k.sh[0], k.sh[1]); c.lineTo(a.el[0], a.el[1]); c.lineTo(wr[0], wr[1]); c.stroke();
    c.fillStyle = IVORY; c.beginPath(); c.arc(a.hd[0], a.hd[1], 7.5, 0, TAU); c.fill();
    c.restore();
  };
  const drawLeg = (l, alpha) => {
    c.save(); c.globalAlpha *= alpha;
    c.strokeStyle = IVORY; c.lineWidth = 10;
    c.beginPath(); c.moveTo(0, k.hipY); c.lineTo(l.kn[0], l.kn[1]); c.lineTo(l.ft[0], l.ft[1]); c.lineTo(l.ft[0] + 13, l.ft[1]); c.stroke();
    c.restore();
  };

  drawArm(k.armB, 0.72);
  drawLeg(k.legB, 0.72);
  drawLeg(k.legF, 1);

  // hood (behind head)
  c.fillStyle = ORANGE;
  c.beginPath(); c.arc(-9, k.shY - 30, 34, 0, TAU); c.fill();
  // hoodie body
  const bs = 1 + p.breathe * 0.02;
  c.save(); c.translate(0, k.hipY); c.scale(1, bs); c.translate(0, -k.hipY);
  c.beginPath(); c.roundRect(-31, k.shY - 8, 62, (k.hipY + 12) - (k.shY - 8), [22, 22, 14, 14]); c.fill();
  // kangaroo pocket (navy line)
  c.save(); c.strokeStyle = NAVY; c.globalAlpha *= 0.45; c.lineWidth = 3;
  c.beginPath(); c.moveTo(-6, k.hipY - 6); c.lineTo(-2, k.hipY - 32); c.lineTo(22, k.hipY - 32); c.lineTo(26, k.hipY - 6); c.stroke();
  c.restore();
  // drawstrings
  c.strokeStyle = IVORY; c.lineWidth = 3;
  c.beginPath(); c.moveTo(9, k.shY + 4); c.lineTo(9, k.shY + 26); c.moveTo(19, k.shY + 2); c.lineTo(19, k.shY + 22); c.stroke();
  c.restore();
  // head
  c.fillStyle = IVORY;
  c.beginPath(); c.arc(4, k.shY - 40, 29, 0, TAU); c.fill();
  // hood rim framing the face
  c.strokeStyle = ORANGE; c.lineWidth = 7;
  c.beginPath(); c.arc(4, k.shY - 40, 32, Math.PI * 0.62, Math.PI * 1.55); c.stroke();

  drawArm(k.armF, 1);
  c.restore();
  return k;
}

/* ---------- primitives ---------- */
function revealStroke(c, pathFn, len, p) {
  if (p <= 0) return;
  c.save();
  if (p < 1) c.setLineDash([len * p, len + 10]);
  c.beginPath(); pathFn(c); c.stroke();
  c.restore();
}
function rrPath(x, y, w, h, r) { return c => c.roundRect(x, y, w, h, r); }
function rrLen(w, h) { return 2 * (w + h); }

function drawIcon(c, type, x, y, size, alpha, rot, glow) {
  if (alpha <= 0 || size <= 0.2) return;
  c.save();
  c.translate(x, y); c.rotate(rot);
  c.globalAlpha *= alpha;
  c.strokeStyle = ORANGE; c.fillStyle = ORANGE;
  c.lineWidth = 3.2; c.lineJoin = 'round'; c.lineCap = 'round';
  if (glow > 0) { c.shadowColor = ORANGE; c.shadowBlur = glow; }
  const s = size / 2;
  c.beginPath();
  switch (type) {
    case 'circle': c.arc(0, 0, s, 0, TAU); c.stroke(); break;
    case 'triangle': c.moveTo(0, -s); c.lineTo(s * .95, s * .7); c.lineTo(-s * .95, s * .7); c.closePath(); c.stroke(); break;
    case 'square': c.roundRect(-s * .8, -s * .8, s * 1.6, s * 1.6, 3); c.stroke(); break;
    case 'diamond': c.moveTo(0, -s); c.lineTo(s * .75, 0); c.lineTo(0, s); c.lineTo(-s * .75, 0); c.closePath(); c.stroke(); break;
    case 'hex': for (let i = 0; i < 6; i++) { const a = i * TAU / 6 - Math.PI / 2; c.lineTo(Math.cos(a) * s, Math.sin(a) * s); } c.closePath(); c.stroke(); break;
    case 'plus': c.moveTo(0, -s); c.lineTo(0, s); c.moveTo(-s, 0); c.lineTo(s, 0); c.stroke(); break;
    case 'moon': {
      c.save();
      c.beginPath(); c.rect(-s * 3, -s * 3, s * 6, s * 6); c.arc(s * .45, -s * .28, s * .82, 0, TAU, true); c.clip('evenodd');
      c.beginPath(); c.arc(0, 0, s, 0, TAU); c.fill();
      c.restore();
      break;
    }
  }
  c.restore();
}

function drawPhone(c, x, y, flat, glow, scale, tilt) {
  if (scale <= 0) return;
  c.save();
  c.translate(x, y); c.rotate(tilt); c.scale(scale, scale);
  const w = lerp(20, 38, flat), h = lerp(36, 8, flat);
  if (glow > 0) {
    const g = c.createRadialGradient(0, 0, 0, 0, 0, 70);
    g.addColorStop(0, 'rgba(255,159,67,' + (0.42 * glow) + ')');
    g.addColorStop(1, 'rgba(255,159,67,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, 70, 0, TAU); c.fill();
  }
  c.fillStyle = IVORY;
  c.beginPath(); c.roundRect(-w / 2, -h / 2, w, h, lerp(5, 3, flat)); c.fill();
  // screen
  const sw = w - lerp(6, 4, flat), sh = h - lerp(9, 4, flat);
  c.fillStyle = NAVY;
  c.beginPath(); c.roundRect(-sw / 2, -sh / 2 - lerp(0.5, 0, flat), sw, sh, 2); c.fill();
  if (glow > 0) {
    c.save(); c.globalAlpha *= glow; c.fillStyle = ORANGE;
    c.shadowColor = ORANGE; c.shadowBlur = 22 * glow;
    c.beginPath(); c.roundRect(-sw / 2, -sh / 2 - lerp(0.5, 0, flat), sw, sh, 2); c.fill();
    c.restore();
  }
  c.restore();
}

/* ---------- scene pieces ---------- */
function drawRingAndWall(c, t) {
  const m = eio(seg(t, 4.0, 5.0));
  const cx = lerp(RING.x, WALL.x, m), cy = lerp(RING.y, WALL.y, m);
  const pulse = Math.sin(t * 3.0) * 3 * (1 - m);
  const hw = lerp(RING.r + pulse, WALL.hw, m), hh = lerp(RING.r + pulse, WALL.hh, m);
  const r = lerp(RING.r + pulse, WALL.r, m);
  const appear = eo(seg(t, 1.15, 2.0));
  if (appear <= 0) return;

  // inner warm wash behind the character
  if (m < 1) {
    c.save();
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, hw);
    g.addColorStop(0, 'rgba(255,159,67,' + (0.10 * appear * (1 - m)) + ')');
    g.addColorStop(1, 'rgba(255,159,67,0)');
    c.fillStyle = g; c.beginPath(); c.roundRect(cx - hw, cy - hh, hw * 2, hh * 2, r); c.fill();
    c.restore();
  }
  // orange glowing outline
  if (m < 1) {
    c.save();
    c.globalAlpha *= (1 - m);
    c.strokeStyle = ORANGE; c.lineWidth = 3.5; c.lineCap = 'round';
    c.shadowColor = ORANGE; c.shadowBlur = 34;
    c.beginPath();
    if (m === 0) c.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + TAU * appear);
    else c.roundRect(cx - hw, cy - hh, hw * 2, hh * 2, r);
    c.stroke();
    c.shadowBlur = 0; c.globalAlpha *= 0.6; c.lineWidth = 1.5; c.stroke();
    c.restore();
  }
  // ivory wall outline (bedroom)
  if (m > 0) {
    c.save();
    c.globalAlpha *= 0.2 * m;
    c.strokeStyle = IVORY; c.lineWidth = 2.5;
    c.beginPath(); c.roundRect(cx - hw, cy - hh, hw * 2, hh * 2, r); c.stroke();
    c.restore();
  }
}

function drawIconsLayer(c, t, front) {
  for (let i = 0; i < 7; i++) {
    const s0 = 1.35 + i * 0.07;
    const appear = eob(seg(t, s0, s0 + 0.3));
    if (appear <= 0) continue;
    const theta = i * TAU / 7 + t * 1.7;
    const ox = HEAD_C.x + Math.cos(theta) * 88, oy = HEAD_C.y + Math.sin(theta) * 24;
    const mv = eio(seg(t, 2.0 + i * 0.06, 2.75 + i * 0.06));
    const behind = Math.sin(theta) < 0 && mv < 0.25;
    if (behind === front) continue;

    const a = arcPos(i);
    const bobY = Math.sin(t * 2.2 + i * 0.9) * 4 * mv;
    let x = lerp(ox, a.x, mv), y = lerp(oy, a.y, mv) + bobY;

    // dot → icon morph
    const dotK = 1 - eio(seg(t, 2.0 + i * 0.06, 2.32 + i * 0.06));
    const iconK = eob(seg(t, 2.15 + i * 0.06, 2.6 + i * 0.06));
    const hl = eio(seg(t, 2.7, 3.2));
    const isMoon = i === 6;
    let size = 24 * iconK * (isMoon ? 1 + 0.9 * hl : 1);
    let alpha = isMoon ? 1 : 1 - 0.42 * hl;
    let glow = isMoon ? 8 + hl * (22 + Math.sin(t * 5) * 6) : 6;
    let rot = (1 - iconK) * 1.4;

    // exit (bedroom transition)
    if (!isMoon) {
      const e = eio(seg(t, 4.0 + i * 0.04, 4.42 + i * 0.04));
      size *= (1 - e); alpha *= (1 - e); y -= 24 * e;
    } else {
      const f = eio(seg(t, 4.1, 5.05));
      if (f > 0) {
        const mx = lerp(x, MOON_HOME.x, f), my = lerp(y, MOON_HOME.y, f) - Math.sin(Math.PI * f) * 60;
        x = mx; y = my;
        size = lerp(size, 30, f);
        glow = lerp(glow, 14, f);
        rot = -0.35 * Math.sin(Math.PI * f);
      }
      const out = eio(seg(t, 9.45, 9.95));
      alpha *= (1 - out);
    }

    // dot
    if (dotK > 0) {
      c.save(); c.globalAlpha *= appear * dotK;
      c.fillStyle = ORANGE; c.shadowColor = ORANGE; c.shadowBlur = 14;
      c.beginPath(); c.arc(x, y, 6.5 * appear, 0, TAU); c.fill();
      c.restore();
    }
    drawIcon(c, ICONS[i], x, y, size, alpha, rot, glow);
  }
}

function drawBedroom(c, t, fade) {
  const R = (a) => eio(seg(t, a, a + 0.65));
  c.save();
  c.strokeStyle = IVORY; c.lineWidth = 4; c.lineCap = 'round'; c.lineJoin = 'round';
  c.globalAlpha *= fade;

  // window
  const pw = R(4.55);
  revealStroke(c, rrPath(WINDOW.x, WINDOW.y, WINDOW.w, WINDOW.h, 10), rrLen(WINDOW.w, WINDOW.h), pw);
  revealStroke(c, cc => { cc.moveTo(WINDOW.x + WINDOW.w / 2, WINDOW.y); cc.lineTo(WINDOW.x + WINDOW.w / 2, WINDOW.y + WINDOW.h); }, WINDOW.h, R(4.8));
  revealStroke(c, cc => { cc.moveTo(WINDOW.x, WINDOW.y + WINDOW.h / 2); cc.lineTo(WINDOW.x + WINDOW.w, WINDOW.y + WINDOW.h / 2); }, WINDOW.w, R(4.85));
  // sill
  revealStroke(c, cc => { cc.moveTo(WINDOW.x - 14, WINDOW.y + WINDOW.h + 10); cc.lineTo(WINDOW.x + WINDOW.w + 14, WINDOW.y + WINDOW.h + 10); }, WINDOW.w + 28, R(4.9));

  // bed
  const pb = R(4.6);
  revealStroke(c, rrPath(1490, 520, 20, 240, 7), rrLen(20, 240), pb);           // headboard
  revealStroke(c, rrPath(990, 598, 16, 162, 6), rrLen(16, 162), pb);             // footboard
  revealStroke(c, rrPath(1006, 640, 484, 50, 16), rrLen(484, 50), R(4.7));       // mattress
  revealStroke(c, cc => { cc.moveTo(1006, 716); cc.lineTo(1490, 716); }, 484, R(4.8)); // rail
  // pillow
  revealStroke(c, rrPath(1386, 604, 98, 34, 17), rrLen(98, 34), R(4.8));
  // blanket fold line
  revealStroke(c, cc => { cc.moveTo(1040, 640); cc.quadraticCurveTo(1150, 628, 1260, 640); }, 230, R(4.95));

  // bedside table
  revealStroke(c, rrPath(1540, 650, 110, 110, 8), rrLen(110, 110), R(4.85));
  revealStroke(c, cc => { cc.moveTo(1540, 695); cc.lineTo(1650, 695); }, 110, R(5.0));
  if (R(5.05) > 0) { c.save(); c.globalAlpha *= R(5.05); c.fillStyle = IVORY; c.beginPath(); c.arc(1595, 674, 4.5, 0, TAU); c.fill(); c.restore(); }
  c.restore();

  // floor line (always strong)
  c.save(); c.globalAlpha *= fade;
  c.strokeStyle = IVORY; c.lineWidth = 4; c.lineCap = 'round';
  const pf = eio(seg(t, 4.3, 5.0));
  if (pf > 0) { c.beginPath(); c.moveTo(1040 - 790 * pf, G); c.lineTo(1040 + 790 * pf, G); c.stroke(); }
  c.restore();
}

function doorRect(t) {
  const k = eio(seg(t, 9.7, 10.7));
  return {
    x: lerp(DOOR.x, FRAME_TARGET.x, k), y: lerp(DOOR.y, FRAME_TARGET.y, k),
    w: lerp(DOOR.w, FRAME_TARGET.w, k), h: lerp(DOOR.h, FRAME_TARGET.h, k), k,
  };
}

function drawDoorBack(c, t, fade) {
  // doorway interior + outside table + the phone resting there
  const reveal = eio(seg(t, 4.5, 5.15));
  if (reveal <= 0) return;
  c.save();
  c.globalAlpha *= fade;
  // hallway light (ivory, very faint)
  c.fillStyle = IVORY; c.globalAlpha *= 0.05 * reveal;
  c.fillRect(DOOR.x, DOOR.y, DOOR.w, DOOR.h);
  c.restore();

  c.save(); c.globalAlpha *= fade;
  c.strokeStyle = IVORY; c.lineWidth = 4; c.lineCap = 'round';
  const pt = eio(seg(t, 4.75, 5.35));
  revealStroke(c, cc => { cc.moveTo(468, TABLE_TOP_Y); cc.lineTo(552, TABLE_TOP_Y); }, 84, pt);
  revealStroke(c, cc => { cc.moveTo(480, TABLE_TOP_Y); cc.lineTo(480, G); cc.moveTo(540, TABLE_TOP_Y); cc.lineTo(540, G); }, 220, pt);
  c.restore();
}

function drawDoorFront(c, t, fade) {
  const reveal = eio(seg(t, 4.5, 5.15));
  if (reveal <= 0) return;
  const d = doorRect(t);
  const k = d.k;
  c.save();
  c.strokeStyle = IVORY; c.lineWidth = lerp(4, 3.5, k); c.lineCap = 'round'; c.lineJoin = 'round';

  // door panel: open (swung) -> closed
  const close = eio(seg(t, 8.45, 9.45));
  const theta = lerp(1.36, 0, close);
  const pw = d.w * Math.cos(theta);
  const skew = Math.sin(theta);
  const x0 = d.x, top = d.y, bot = d.y + d.h;
  c.save();
  c.globalAlpha *= reveal;
  c.fillStyle = NAVY;
  c.beginPath();
  c.moveTo(x0, top); c.lineTo(x0 + pw, top - skew * 34); c.lineTo(x0 + pw, bot + skew * 4); c.lineTo(x0, bot); c.closePath();
  c.fill();
  c.globalAlpha *= lerp(0.9, 1, close);
  c.stroke();
  // panel insets & knob (fade during morph)
  const det = (1 - eio(seg(t, 9.5, 9.95))) * clamp(close * 1.4 + 0.25);
  if (det > 0) {
    c.save(); c.globalAlpha *= det * 0.55; c.lineWidth = 2.5;
    const ix = (u) => x0 + pw * u;
    const iy = (u, v) => lerp(top - skew * 34 * u, bot + skew * 4 * u, v);
    c.beginPath();
    c.moveTo(ix(.18), iy(.18, .08)); c.lineTo(ix(.82), iy(.82, .08)); c.lineTo(ix(.82), iy(.82, .44)); c.lineTo(ix(.18), iy(.18, .44)); c.closePath();
    c.moveTo(ix(.18), iy(.18, .54)); c.lineTo(ix(.82), iy(.82, .54)); c.lineTo(ix(.82), iy(.82, .92)); c.lineTo(ix(.18), iy(.18, .92)); c.closePath();
    c.stroke(); c.restore();
    c.save(); c.globalAlpha *= det; c.fillStyle = ORANGE;
    c.beginPath(); c.arc(ix(.86), iy(.86, .52), 5.5, 0, TAU); c.fill(); c.restore();
  }
  c.restore();

  // frame (left, top, right; bottom edge closes during the morph)
  const radius = lerp(0, 22, k);
  c.save();
  if (k > 0) {
    // orange glow builds as it becomes the next scene's frame
    c.save(); c.globalAlpha *= 0.85 * k;
    c.strokeStyle = ORANGE; c.shadowColor = ORANGE; c.shadowBlur = 40 * k; c.lineWidth = 3;
    c.beginPath(); c.roundRect(d.x - 10 * k, d.y - 10 * k, d.w + 20 * k, d.h + 20 * k, radius + 8 * k); c.stroke();
    c.restore();
  }
  const pf = eio(seg(t, 4.5, 5.15));
  if (k === 0) {
    revealStroke(c, cc => { cc.moveTo(d.x, d.y + d.h); cc.lineTo(d.x, d.y); cc.lineTo(d.x + d.w, d.y); cc.lineTo(d.x + d.w, d.y + d.h); }, d.h * 2 + d.w, pf);
  } else {
    c.beginPath(); c.roundRect(d.x, d.y, d.w, d.h, radius); c.stroke();
    if (k > 0.6) { c.save(); c.globalAlpha *= 0.035 * seg(k, 0.6, 1); c.fillStyle = IVORY; c.fill(); c.restore(); }
  }
  c.restore();
  c.restore();
}

/* ---------- phone ---------- */
function phoneState(t, p, k) {
  const pop = eob(seg(t, 4.45, 4.8));
  if (pop <= 0) return null;
  const glow = 1 - eio(seg(t, 7.8, 8.15));
  const hand = toWorld(p, k.armF.hd[0], k.armF.hd[1]);
  const inHand = [hand[0] + 3 * p.face, hand[1] - 20];
  const rel = eio(seg(t, 7.38, 7.78));
  if (t < 7.38) return { x: inHand[0], y: inHand[1], flat: 0, glow, scale: pop, tilt: 0, held: true };
  // release point = hand pose at full reach (deterministic)
  const start = phoneState.releaseAt || (phoneState.releaseAt = (() => {
    const pr = poseAt(7.38), kr = skeleton(pr); const h = toWorld(pr, kr.armF.hd[0], kr.armF.hd[1]);
    return [h[0] + 3 * pr.face, h[1] - 20];
  })());
  const settle = Math.sin(seg(t, 7.78, 7.98) * Math.PI) * 3 * (1 - seg(t, 7.78, 7.98));
  const x = lerp(start[0], PHONE_REST.x, rel);
  const y = lerp(start[1], PHONE_REST.y, rel) - Math.sin(Math.PI * rel) * 14 - settle;
  return { x, y, flat: rel, glow, scale: 1, tilt: Math.sin(Math.PI * rel) * -0.35, held: false };
}

/* ---------- camera ---------- */
function camera(t) {
  let s = 1, fx = 960, fy = 540;
  const a = eio(seg(t, 0.1, 2.0)), b = eio(seg(t, 2.0, 4.0)), back = eio(seg(t, 4.0, 5.2));
  s = 1 + 0.12 * a + 0.04 * b;
  fy = lerp(540, 505, a);
  s = lerp(s, 1, back); fx = lerp(fx, WALL.x, back); fy = lerp(fy, 540, back);
  const drift = eio(seg(t, 5.2, 9.4)), settle = eio(seg(t, 9.4, 10.2));
  s += 0.035 * drift * (1 - settle);
  return { s, fx, fy };
}

/* ---------- frame ---------- */
function renderAt(t) {
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1;
  c.fillStyle = NAVY; c.fillRect(0, 0, W, H);

  const cam = camera(t);
  c.setTransform(cam.s, 0, 0, cam.s, W / 2 - cam.fx * cam.s, H / 2 - cam.fy * cam.s);

  const out = 1 - eio(seg(t, 9.45, 9.95));   // everything except the door fades out

  c.save(); c.globalAlpha = out; drawRingAndWall(c, t); c.restore();
  drawBedroom(c, t, out);
  drawDoorBack(c, t, out);

  const p = poseAt(t);
  const k = skeleton(p);
  const ph = phoneState(t, p, k);
  if (ph && !ph.held) { c.save(); c.globalAlpha = out; drawPhone(c, ph.x, ph.y, ph.flat, ph.glow, ph.scale, ph.tilt); c.restore(); }

  drawDoorFront(c, t, out);

  c.save(); c.globalAlpha = 1; drawIconsLayer(c, t, false); c.restore();
  // bed is drawn before the character, so he lies on top of it
  c.save(); c.globalAlpha = out; drawChar(c, p); c.restore();
  if (ph && ph.held) { c.save(); c.globalAlpha = out; drawPhone(c, ph.x, ph.y, ph.flat, ph.glow, ph.scale, ph.tilt); c.restore(); }
  c.save(); c.globalAlpha = 1; drawIconsLayer(c, t, true); c.restore();
}
window.renderAt = renderAt;
window.DURATION = DURATION;

/* ---------- playback ---------- */
const params = new URLSearchParams(location.search);
if (params.has('t')) {
  renderAt(parseFloat(params.get('t')));
} else if (!params.has('capture')) {
  let start = performance.now();
  canvas.addEventListener('click', () => { start = performance.now(); });
  const loop = now => {
    const t = ((now - start) / 1000) % (DURATION + 0.8);
    renderAt(Math.min(t, DURATION));
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
